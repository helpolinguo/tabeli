<!DOCTYPE html><html lang="io"><meta charset="utf-8">
<title>{{TITRO}}</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--enk:#1a1a1a;--pap:#fbfaf7;--sub:#6b6560;--acc:#7a4b2a;--lin:#e2ddd5;
 --pap2:#f4f1ea;--flag:#b4552d}
@media(prefers-color-scheme:dark){:root{--enk:#e8e4de;--pap:#16161a;--sub:#9a938c;
 --acc:#d69a6a;--lin:#2c2c33;--pap2:#1c1c21;--flag:#e08a5c}}
*{box-sizing:border-box}
body{margin:0;background:var(--pap);color:var(--enk);
 font:16px/1.55 "Iowan Old Style",Palatino,"Palatino Linotype",Georgia,serif}

/* L'ANCRE S'ARRETE SOUS LA BARRE. La barre est « sticky » : elle
   recouvre le haut de la page, et un saut vers #t02-apar-1 amenait la
   cible a zero, donc DERRIERE elle -- le titre ido du tableau etait
   cache, et la lecture commencait au milieu du bloc. La barre se
   mesurait bien dans --kapo, mais cette mesure ne servait qu'a poser le
   volet lateral ; rien ne la retranchait du saut. Une seule declaration
   sur le conteneur de defilement suffit, et vaut pour toutes les cibles
   -- les blocs comme les lignes d'apparat, qui sont des <span>. */
html{scroll-padding-top:calc(var(--kapo,104px) + 12px)}

/* --- LA BARRE. Elle est glutinoza : ol restas sur la ecrano dum la
   lekto. Sua alteso ne esas fixa -- du lineo de titulo sur telefono --
   do la skripto mezuras ol e pozas ol en --kapo ; omna ancero haltas
   sub ol. --- */
header{position:sticky;top:0;background:var(--pap);border-bottom:1px solid var(--lin);
 padding:13px 20px 11px;z-index:20}
.tito{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
h1{margin:0 0 2px;font-size:17px;font-weight:600;letter-spacing:.01em}
.sub{color:var(--sub);font-size:12.5px;margin-bottom:9px}
.dls{flex:none;display:flex;gap:7px}
.dl{display:inline-flex;align-items:center;gap:6px;text-decoration:none;
 border:1px solid var(--lin);border-radius:7px;padding:6px 11px;color:var(--acc);
 background:var(--pap);font-size:13px;font-weight:600;white-space:nowrap;
 transition:background .12s,border-color .12s}
.dl:hover{background:var(--lin);border-color:var(--acc)}
.dl svg{display:block;width:15px;height:15px;stroke:currentColor;fill:none;
 stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:700px){.dl span{display:none}.dl{padding:7px 9px}}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=search]{flex:1 1 240px;min-width:150px;padding:8px 11px;
 border:1px solid var(--lin);border-radius:7px;background:var(--pap);
 color:var(--enk);font:inherit;font-size:16px}
/* 16px exacte, e ne min: Safari sur iPhone zomas automate sur irga
   kampo di qua la litero-grandeso esas sub 16px, kande onu tushas lu.
   La altra solvuro -- maximum-scale=1 -- impedus anke la zomo per la
   fingri, do la lekteblesa por qui bezonas lu. */
input[type=search]:focus{outline:2px solid var(--acc);outline-offset:-1px}
select#lg{flex:none;padding:8px 10px;border:1px solid var(--lin);border-radius:7px;
 background:var(--pap);color:var(--enk);font:600 13px/1 system-ui,sans-serif;
 cursor:pointer}
/* LE CHOIX DE LANGUE TIENT SUR LA LIGNE DE LA RECHERCHE. Sur telephone
   il passait a la ligne pour lui seul : « Materio » plus la recherche
   plus le selecteur depassaient de quelques pixels la largeur d'un
   iPhone, et ce retour a la ligne enflait la barre -- 215px de haut au
   lieu de 170 -- qui mange d'autant la page, puisqu'elle est collante.
   Or le retour a la ligne se decide sur la largeur DE BASE, non sur la
   largeur minimale : c'est « flex-basis » qu'il faut baisser, et
   laisser ensuite la recherche s'etirer pour prendre ce qui reste. Le
   selecteur se retrouve ainsi a droite, sous les deux boutons de
   telechargement, et la barre tient sur deux lignes jusqu'a 320px.
   CETTE REGLE VIENT APRES CELLES QU'ELLE CORRIGE. Une requete de media
   n'ajoute rien a la specificite : placee plus haut, elle perdait
   contre le « min-width:150px » de la recherche, et rien ne bougeait. */
@media (max-width:700px){
 input[type=search]{min-width:0;flex:1 1 60px}
 select#lg{padding:8px 6px}}
.tir{display:none;flex:none;border:1px solid var(--lin);border-radius:7px;
 background:var(--pap);color:var(--acc);font:600 12.5px/1 system-ui,sans-serif;
 padding:9px 11px;cursor:pointer}
.tir:hover{background:var(--lin)}

/* --- DU PANELI, ne tri. La Kompleta Gramatiko havas anke panelo dextra
   por la chefa vorti ; ca libro ne havas oli, e la loko qua restas
   servas la DU KOLONI DI TEXTO, qui bezonas ol. --- */
main{display:grid;grid-template-columns:250px minmax(0,1fr);
 max-width:1560px;margin:0 auto;gap:0}
nav{position:sticky;top:var(--kapo,104px);height:calc(100vh - var(--kapo,104px));
 overflow-y:auto;padding:16px 14px 60px;font-family:system-ui,sans-serif;
 font-size:13px;border-right:1px solid var(--lin)}
nav .parto{margin:14px 0 5px;font-size:11px;letter-spacing:.07em;
 text-transform:uppercase;color:var(--sub);font-weight:700}
nav a{display:block;padding:3px 6px;border-radius:5px;text-decoration:none;
 color:var(--enk);line-height:1.35;font-size:12.5px}
/* Deux rangs dans la table : le tableau, et ses intertitres. Seize
   tableaux et quatre-vingts intertitres a plat seraient illisibles. */
/* Trois rangs, parce que le livre en a trois : le tableau, la scene,
   l'intertitre. Seize tableaux et cent quarante intertitres a plat
   seraient une liste, non une table. */
nav a.tt{margin-top:13px;font-size:12.5px;font-weight:600}
nav a.tt b{color:var(--acc);font-weight:700}
nav a.sc{padding-left:14px;font-size:12px;font-style:italic}
nav a.st{padding-left:26px;color:var(--sub);font-size:12px}
nav a.st:hover,nav a.sc:hover{color:var(--enk)}
nav a:hover{background:var(--lin)}
nav a.nun{color:var(--acc);font-weight:700;background:rgba(122,75,42,.07)}

/* LE BLANC LATERAL DOIT LOGER LE FOLIO. Il se pose HORS de sa colonne
   -- 30px a gauche pour l'ido, 28px a droite pour la traduction -- et
   ce blanc-ci est tout ce qu'il a pour s'y tenir. A 26px il en manquait
   deux a droite : la page depassait la fenetre de 2px, et l'on pouvait
   la faire glisser lateralement. Cela ne se voyait qu'entre 1181px --
   sous quoi le folio rentre dans le flux -- et 1600px, ou les marges
   automatiques de « main » finissent par absorber le debordement ;
   d'ou une gene qui paraissait aller et venir sans raison. */
#kont{padding:22px 32px 140px}

/* --- LA DU KOLONI. Grid e ne du kolumni flotanta : la du celi di un
   rango devas komencar ye la sama alteso, e nur grid garantias to
   kande la texti havas diferanta longeso -- to qua eventas sempre,
   nam la du edituri ne dicas la sama kozo per la sama nombro di vorti.
   La linio inter la koloni esas la limito : ol montras ke la du texti
   esas la sama alineo, ne du alinei sucedanta. --- */
.r{display:grid;grid-template-columns:1fr 1fr;gap:0 34px;
 align-items:start;position:relative}
.r+.r{margin-top:.62em}
.k{position:relative;min-width:0;text-align:justify;hyphens:auto;
 -webkit-hyphens:auto}
.k.io{padding-right:17px;border-right:1px solid var(--lin)}
.k.tra{padding-left:0}
.r.sub .k,.r.apar .k{text-align:center}
.vaka{}
/* La celo vakua ne esas eroro : ol dicas ke ta alineo ne existas en
   l'altra edituro. Guignon dividis per intertitli un texto quan
   Rochelle laisas kurar ; la vakuo esas la diferenco mem, e la kasar
   igus la du koloni mentiar. */
.k.tra.vaka::after{content:"—";color:var(--lin);font-size:13px}
.r.sub .k.tra.vaka::after{content:""}

.r.p .k{text-indent:1.3em}
.r.sub{margin:1.9em 0 .9em}
.r.sub .k{font-variant:small-caps;letter-spacing:.06em;font-weight:600;
 text-indent:0;color:var(--enk)}
.r.apar{margin:.4em 0 1.8em}
.r.apar .k{text-indent:0;line-height:1.5}
.ln{display:block;letter-spacing:.09em;margin:.28em 0}
.ln.lg{font-weight:700;letter-spacing:.01em;font-size:1.32em;margin:.42em 0}

/* --- LE ROLE HABILLE LA LIGNE, NON LA MACRO. Les deux volumes ne
   composent pas de la meme facon ce qui joue le meme role : le titre du
   tableau 8 passe par \VUpk cote ido et par \VUtitre cote francais, de
   sorte que la page donnait « La Rekolto. » en corps de texte en face
   d'un « La Moisson. --- Les aspects de la campagne. » en gros et gras ;
   et la scene etait italique d'un cote, romaine de l'autre. Le PDF garde
   chaque fac-simile tel qu'il est ; la page de lecture, elle, sert a
   COMPARER, et deux choses qui se repondent doivent se ressembler. Ces
   regles viennent APRES « .ln » et « .ln.lg », qu'elles annulent : a
   specificite egale, c'est la derniere qui l'emporte. --- */
/* « font-variant:normal » des la base : la cellule d'un intertitre
   porte « small-caps », et un titre de tableau loge dans un intertitre
   -- tableaux 7, 9, 14, 15 -- en heritait, si bien qu'il sortait en
   petites capitales quand celui du tableau 10 sortait en gras. C'est
   « sekc » qui redemande les petites capitales, et lui seul. */
.k [data-rolo]{display:block;font-style:normal;font-weight:400;
 font-variant:normal;font-size:1rem;letter-spacing:.04em;margin:.3em 0}
/* L'italique du releve ne decide plus : le role s'en charge. Sans quoi
   « Unesma ceno. », compose en italique par Guignon, restait penche en
   face d'un « Première scène. » droit. */
.k [data-rolo] i,.k [data-rolo] em{font-style:inherit}
.k [data-rolo="avan"]{font-size:.9rem;color:var(--sub);letter-spacing:.09em}
.k [data-rolo="serio"]{font-size:.82rem;color:var(--sub);letter-spacing:.14em;
 text-transform:uppercase;margin:.7em 0 .35em}
.k [data-rolo="nom"]{font-weight:700;font-size:1.32rem;letter-spacing:.02em;
 margin:.45em 0 .3em}
.k [data-rolo="tit"]{font-weight:700;font-size:1.1rem;letter-spacing:.02em;
 margin:.12em 0}
/* LE TITRE D'UNE SCENE. Il se composait en section, si bien qu'il
   changeait de taille d'un tableau a l'autre -- gras au tableau 7, ou
   il tient lieu de titre du tableau, petites capitales au tableau 3, ou
   il n'en tient pas lieu. C'est pourtant la meme chose. Il a donc son
   rang a lui, entre le titre du tableau et l'intertitre. */
.k [data-rolo="titceno"]{font-weight:700;font-size:1rem;letter-spacing:.02em;
 margin:.15em 0 .3em}
/* Les lignes d'un meme titre se relisent d'un trait : « inline-block »
   les met sur une ligne sans leur oter leurs marges, et le liant -- le
   tiret ou l'espace -- est pose dans le texte par rendre(). */
.k [data-kunligita]{display:inline-block;margin-top:0;margin-bottom:0}
.k [data-rolo="ceno"]{font-style:italic;font-variant:normal;font-size:.88rem;
 letter-spacing:.03em;margin:.55em 0 .25em}
.k [data-rolo="sekc"]{font-variant:small-caps;font-weight:600;font-size:.85rem;
 letter-spacing:.07em;margin:.45em 0 .25em}
.k [data-rolo="subt"]{font-style:italic;font-size:.78rem;color:var(--sub);
 letter-spacing:.02em;margin:.1em 0 .35em}
.fil{display:block;width:52px;height:1px;background:var(--lin);
 margin:.85em auto}
.orn{display:block;color:var(--sub);margin:.5em 0;font-size:.9em}

/* La folio se pose EN DEHORS du texte, dans le blanc de gauche de sa
   colonne : il ne doit ni entrer dans la justification ni la reduire.
   Sur ecran etroit — ou les deux colonnes s'empilent — il rentre dans
   le flux, faute de blanc ou se mettre. */
/* « text-indent:0 » n'est pas un detail. L'alinea porte
   « text-indent:1.3em », et le folio, qui est un bloc dans cette
   colonne, en HERITAIT : son numero se trouvait pousse de 21px vers la
   droite sur les alineas, et restait au bord sur les titres et les
   ouvertures, qui n'ont pas d'alinea. Le numero semblait donc filer
   vers la gauche des qu'on quittait un paragraphe -- alors qu'il ne
   bougeait pas : c'etaient les autres qui etaient de trop a droite. */
.fol{position:absolute;left:-30px;top:.15em;font:600 11px/1 system-ui,sans-serif;
 color:var(--sub);text-decoration:none;padding:2px 3px;border-radius:3px;
 text-indent:0}
.fol:hover{color:var(--acc);background:var(--lin)}
.k.tra .fol{left:auto;right:-28px}
@media (max-width:1180px){
 .fol{position:static;float:left;margin:.2em .5em 0 0}
 .k.tra .fol{float:right;margin:.2em 0 0 .5em}}

/* --- LA NOTE SE REPLIE. Au bas d'une page imprimee la note a sa
   place ; dans une colonne qui defile, posee entre deux alineas, elle
   coupe la lecture. L'appel devient donc un bouton, et la note s'ouvre
   sous l'alinea qui la porte -- comme dans la page du Kompleta
   Gramatiko. C'est un <button> et non un <a> : il ne mene nulle part,
   il montre et il cache ; le clavier et les lecteurs d'ecran le
   comprennent ainsi, et aria-expanded le leur dit. --- */
/* L'EXPOSANT GARDE SA BOITE. « vertical-align:super » avec
   « line-height:0 » la reduisait a zero de haut : le glyphe debordait
   seul, le pointille lui passait au travers, et l'etat ouvert -- fond
   « --acc », texte « --pap » -- n'avait plus rien ou se peindre. Le
   marqueur devenait creme sur creme, donc invisible au clic. On garde
   donc une boite pleine et on remonte l'exposant par un decalage
   relatif, qui ne compte pas dans la ligne : les interlignes du releve
   ne bougent pas d'un pixel. */
.apel{font:inherit;font-size:.72em;line-height:1;position:relative;top:-.42em;
 background:none;border:0;padding:0 .12em;margin:0;cursor:pointer;
 color:var(--acc);font-weight:600;border-bottom:1px dotted var(--acc)}
.apel:hover{background:var(--lin)}
/* Une bordure transparente, et non « 0 » : les deux etats font alors la
   meme hauteur, et le mot ne tressaute pas quand la note s'ouvre. */
.apel[aria-expanded=true]{background:var(--acc);color:var(--pap);
 border-radius:3px;border-bottom:1px solid transparent}
.noto{margin:.5em 0 .7em;padding:.6em .8em;border-left:2px solid var(--acc);
 background:var(--pap2);font-size:13.5px;line-height:1.5;color:var(--sub);
 border-radius:0 5px 5px 0}
.noto b{color:var(--enk)}

/* LE GROS PLAN SUR UN NUMERO. Le renvoi « (12) » garde exactement
   l'aspect qu'il avait — meme corps, meme exposant, meme place dans la
   ligne — et ne se signale que par un souligne pointille : la page ne
   doit pas se couvrir de boutons. Ceux dont on ne connait pas la
   position sur la planche restent du texte, sans souligne. */
.lupo{font:inherit;background:none;border:0;padding:0;margin:0;
 cursor:zoom-in;color:inherit;line-height:inherit}
.lupo sup, .lupo.nuda{border-bottom:1px dotted var(--acc)}
.lupo:hover sup, .lupo.nuda:hover{background:var(--lin)}
.lupo[aria-expanded=true] sup, .lupo.nuda[aria-expanded=true]{
 background:var(--acc);color:var(--pap);
 border-radius:3px;border-bottom-color:transparent}
/* UN RENVOI PEUT EN VALOIR TROIS. « Les tableaux muraux (9, 11, 12) »
   nomme trois objets a la fois ; chaque numero y est cliquable pour son
   compte, tandis que les parentheses et les virgules restent du texte.
   Le bouton est alors NU -- il n'a pas d'exposant a lui, se trouvant
   deja dans celui du groupe -- et porte donc lui-meme le pointille.

   LA HAUTEUR DE LIGNE DOIT ETRE RENDUE AU BOUTON NU. Un exposant porte
   « line-height:0 » pour ne pas ecarter les lignes du paragraphe ; le
   bouton, qui en herite, se retrouve avec une boite haute d'un point,
   et son pointille tombe alors AU MILIEU des chiffres au lieu de passer
   dessous -- cinq points trop haut, mesure faite. « normal » lui rend sa
   boite : elle retombe exactement sur celle des autres renvois, et
   l'interligne du paragraphe ne bouge pas d'un point. */
.lupo.nuda{font:inherit;line-height:normal}
/* Le gros plan se pose sous l'alinea, comme une note : c'est la meme
   idee, montrer sans quitter sa ligne. */
/* LA VUE EST PANORAMIQUE, ET C'EST VOULU. Sa HAUTEUR est fixe — donc
   le grossissement aussi, neuf hauteurs de chiffre quelle que soit la
   fenetre — et sa largeur prend tout ce que la page lui donne. Une
   fenetre large montre donc plus de la scene autour de l'objet, au
   meme grossissement ; une fenetre etroite en montre moins. C'est la
   scene qui explique l'objet, non l'objet seul. */
.lupo-vido{margin:.5em 0 .8em;border-left:2px solid var(--acc);
 background:var(--pap2);border-radius:0 5px 5px 0;overflow:hidden}
.lupo-vido .kadro{width:100%;height:250px;background-repeat:no-repeat;
 background-color:var(--pap2);cursor:zoom-out}
.lupo-vido .dir{display:flex;justify-content:space-between;gap:1em;
 padding:.42em .8em;font-size:12.5px;color:var(--sub);
 border-top:1px solid var(--lin)}
.lupo-vido .dir b{color:var(--enk);font-weight:600}
@media (max-width:900px){.lupo-vido .kadro{height:190px}}

/* LA JOINTURE. Rochelle coupe parfois en deux un alinea que Guignon
   laisse d'un tenant. Le PDF garde chaque edition telle quelle ; ici
   les deux moities sont recollees pour que les rangs se repondent, et
   ce filet dit ou l'autre edition allait a la ligne. Un simple blanc
   se lisait comme une coquille. */
.nal{display:inline-block;width:1.1em;margin:0 .25em;
 border-left:1px solid var(--lin);height:.85em;vertical-align:-.05em}

b{font-weight:700}
sup{font-size:.66em;line-height:0;color:var(--sub);font-weight:400}
.k.io sup,.k.tra sup{margin-left:.08em}

/* --- LE TABLEAU MURAL. Le livret decrit une gravure que le lecteur de
   1926 avait au mur ; la page la lui rend, au-dessus du texte qu'elle
   illustre. Elle ne se charge QUE lorsqu'elle approche du champ --
   « loading=lazy » --, et ses dimensions sont ecrites dans la balise :
   la place est donc reservee des le depart, et le texte ne sursaute pas
   quand l'image arrive. --- */
.gravuro{margin:2.2em 0 .6em;text-align:center}
.gravuro img{width:100%;max-width:1246px;height:auto;/* La gravure remplit son cadre : sans largeur declaree, elle s'arretait
   a sa taille propre et « sizes » annoncait alors une largeur qu'elle
   n'occupait pas -- le navigateur choisissait de travers. */
 border:1px solid var(--lin);
 border-radius:3px;background:var(--pap2);cursor:zoom-in;
 box-shadow:0 1px 4px rgba(0,0,0,.10);transition:box-shadow .15s}
.gravuro img:hover{box-shadow:0 2px 10px rgba(0,0,0,.18)}
@media (prefers-color-scheme:dark){.gravuro img,.gravuro img:hover{box-shadow:none}}

/* --- LE PLEIN ECRAN. Un tableau mural se regarde de pres ; la colonne
   de lecture est trop etroite pour cela. Au clic il s'ouvre sur toute
   la fenetre, SANS quitter la page -- ni nouvel onglet, ni nouvelle
   requete : c'est l'image de detail, celle-la meme ou se decouperont
   les gros plans, et une fois chargee elle ne l'est plus jamais.
   La transition porte sur l'opacite et sur une legere echelle : c'est
   assez pour que l'oeil suive l'ouverture sans que rien ne saute.
   « prefers-reduced-motion » la coupe pour qui n'en veut pas. --- */
.plena{position:fixed;inset:0;z-index:50;display:flex;align-items:center;
 justify-content:center;background:rgba(20,18,16,.94);
 opacity:0;visibility:hidden;transition:opacity .22s ease,visibility .22s;
 cursor:zoom-out;padding:18px}
.plena.mont{opacity:1;visibility:visible}
.plena img{max-width:100%;max-height:100%;object-fit:contain;
 transform:scale(.97);transition:transform .22s ease;border-radius:2px}
.plena.mont img{transform:scale(1)}
.plena .fermi{position:absolute;top:12px;right:16px;border:0;background:none;
 color:#f2ede6;font:600 26px/1 system-ui,sans-serif;cursor:pointer;padding:6px 10px}
@media (prefers-reduced-motion:reduce){
 .plena,.plena img{transition:none}}

/* La recherche : ce qui ne correspond pas disparait, et l'accord se
   marque dans le texte meme. Le surlignage se pose sur un <mark>
   fabrique par le script, jamais dans la source. */
mark{background:rgba(180,85,45,.22);color:inherit;border-radius:2px}
.for{display:none}
/* L'ouverture du tableau reste au-dessus de ses resultats, pour qu'on
   sache OU l'on a trouve. Mais elle n'est pas un resultat : on la
   reduit a son libelle -- numero et titre, que le script a depose dans
   data-tete -- au lieu d'etaler les quatre lignes de son apparat, page
   de serie et sous-titres de lecons comprises, au-dessus de deux
   alineas. */
.r.apar.tete{display:block;margin:1.6em 0 .1em;padding-bottom:.3em;
 border-bottom:1px solid var(--lin);text-align:left}
.r.apar.tete>*{display:none}
.r.apar.tete::before{content:attr(data-tete);display:block;color:var(--acc);
 font:600 13px/1.4 system-ui,sans-serif;letter-spacing:.02em}
/* Une recherche sans reponse doit se voir : sans cela la page reste
   simplement vide, et l'on croit a une panne. */
.nulo{display:none;padding:2.6em 20px;color:var(--sub);text-align:center;
 font-size:14.5px}
.nulo.mont{display:block}

/* --- SUR ECRAN ETROIT les deux colonnes s'empilent : l'ido d'abord,
   la traduction dessous, avec un filet a gauche pour qu'on voie du
   premier coup d'oeil laquelle on lit. Le paralelismo resta lisible
   parce que chaque rango garde son bloc. --- */
@media (max-width:900px){
 main{grid-template-columns:1fr}
 nav{position:fixed;left:0;top:var(--kapo,150px);bottom:0;width:270px;
  background:var(--pap);z-index:15;transform:translateX(-100%);
  transition:transform .18s;box-shadow:0 0 24px rgba(0,0,0,.14)}
 nav.mont{transform:none}
 .tir{display:block}
 #kont{padding:18px 16px 120px}
 .r{grid-template-columns:1fr;gap:.35em 0}
 .k.io{padding-right:0;border-right:0}
 .k.tra{padding-left:11px;border-left:2px solid var(--lin);color:var(--sub)}
 .r.sub .k.tra,.r.apar .k.tra{border-left:0;padding-left:0}}
@media (max-width:900px) and (prefers-color-scheme:dark){
 nav{box-shadow:0 0 24px rgba(0,0,0,.6)}}

</style>

<header>
<div class="tito">
<div>
<h1>{{TITRO}}</h1>
<div class="sub">{{SUBTITRO}}</div>
</div>
<div class="dls">
<a class="dl" href="tabeli.pdf" download title="Deskargar la Ido-versiono (PDF)">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M4 20h16"/></svg><span>Ido</span></a>
<a class="dl" href="tableaux.pdf" download title="Télécharger la version française (PDF)">
<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12"/><path d="M7 11l5 5 5-5"/><path d="M4 20h16"/></svg><span>Français</span></a>
</div>
</div>
<div class="bar">
 <button class="tir" id="tirL" aria-label="Tabelo di la materio">&#9776; Materio</button>
 <input type="search" id="q" placeholder="Serchez en la du texti&hellip;" autocomplete="off">
 <select id="lg" aria-label="Linguo dil dextra kolono">{{LINGUI}}</select>
</div>
</header>

<main>
<!-- Les divisions de serie viennent avec la table elle-meme : le
     fac-simile les annonce en tete des tableaux 1, 7 et 11, et les
     ecrire ici en dur n'en donnait qu'une pour les seize tableaux.
     NE PAS nommer ici un marqueur du gabarit : rendre() les remplace
     PARTOUT, commentaires compris, et la table entiere se recopiait
     dans ce commentaire -- onze kilo-octets invisibles. -->
<nav id="nav">{{NAV}}</nav>
<div><div id="kont">
{{KONTENO}}
</div>
<p class="nulo" id="nulo" role="status"></p>
<div class="plena" id="plena" role="dialog" aria-modal="true" aria-label="Tabelo">
 <button class="fermi" id="fermi" aria-label="Klozar">&times;</button>
 <img id="plena-bildo" alt="">
</div>

</div>
</main>

<script>
"use strict";
var LANGUES = {{LINGUIJSON}};

/* La hauteur de l'en-tete n'est pas une constante : deux lignes de
   titre sur telephone, une sur ordinateur. On la mesure au chargement
   et a chaque redimension, et on la depose dans --kapo ; les valeurs
   en dur du CSS ne servent que de secours avant que le script ait
   tourne. */
function kapo(){
  var h = document.querySelector("header").offsetHeight;
  document.documentElement.style.setProperty("--kapo", h + "px");
}
addEventListener("resize", kapo); kapo();

/* Le volet de la table des matieres, sur ecran etroit. */
var nav = document.getElementById("nav");
document.getElementById("tirL").onclick = function(){ nav.classList.toggle("mont"); };
nav.addEventListener("click", function(e){
  if (e.target.tagName === "A" && innerWidth <= 900) nav.classList.remove("mont");
});
/* UN TOUCHER AU DEHORS LE REFERME. Sur telephone le volet couvre la
   page ; il ne se fermait qu'en touchant de nouveau « Materio » ou en
   suivant un renvoi, et l'on restait pris devant la table. On ecoute
   donc le toucher plutot que le clic -- sur telephone il vient le
   premier, et le volet part sans attendre les 300ms du clic. Le bouton
   est exclu : il a deja sa bascule, et la fermer ici la rouvrirait
   aussitot. */
document.addEventListener("pointerdown", function(e){
  if (!nav.classList.contains("mont")) return;
  if (nav.contains(e.target) || e.target.closest("#tirL")) return;
  nav.classList.remove("mont");
});

/* --- LE CHOIX DE LANGUE. Une seule colonne de droite est visible a la
   fois ; les autres restent dans la page, cachees. Elles n'y sont pas
   pour rien : la recherche les traverse, et le passage d'une langue a
   l'autre est instantane, sans requete. --- */
var sel = document.getElementById("lg");
function poserLangue(code){
  document.querySelectorAll(".k.tra").forEach(function(k){
    k.style.display = (k.dataset.lg === code) ? "" : "none";
  });
  try { localStorage.setItem("tabeli-lg", code); } catch(e){}
}
sel.onchange = function(){ poserLangue(sel.value); };
var memo = null;
try { memo = localStorage.getItem("tabeli-lg"); } catch(e){}
if (memo && [].some.call(sel.options, function(o){ return o.value === memo; }))
  sel.value = memo;
poserLangue(sel.value);

/* --- LA RECHERCHE. Elle porte sur LES DEUX textes a la fois : un mot
   ido trouve le paragraphe, et sa traduction reste en face, meme si
   elle ne contient pas le mot. C'est le but des deux colonnes ; une
   recherche qui masquerait la case d'en face les separerait. --- */
var q = document.getElementById("q");
var rangi = [].slice.call(document.querySelectorAll(".r"));
var origine = rangi.map(function(r){
  return [].map.call(r.querySelectorAll(".k"), function(k){ return k.innerHTML; });
});
function sansAccent(s){
  return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
}
function surligner(el, brut, terme){
  if (!terme) { el.innerHTML = brut; return false; }
  /* On surligne dans le TEXTE, pas dans les balises : sans cela un
     terme qui tombe dans un attribut (href, title) casserait la page.
     On parcourt donc les noeuds de texte du fragment. */
  var d = document.createElement("div");
  d.innerHTML = brut;
  var trouve = false;
  var it = document.createTreeWalker(d, NodeFilter.SHOW_TEXT);
  var noeuds = [], n;
  while ((n = it.nextNode())) noeuds.push(n);
  noeuds.forEach(function(t){
    var s = t.nodeValue, plat = sansAccent(s), i = plat.indexOf(terme);
    if (i < 0) return;
    trouve = true;
    var frag = document.createDocumentFragment(), pos = 0;
    while (i >= 0){
      frag.appendChild(document.createTextNode(s.slice(pos, i)));
      var m = document.createElement("mark");
      m.textContent = s.slice(i, i + terme.length);
      frag.appendChild(m);
      pos = i + terme.length;
      i = plat.indexOf(terme, pos);
    }
    frag.appendChild(document.createTextNode(s.slice(pos)));
    t.parentNode.replaceChild(frag, t);
  });
  el.innerHTML = d.innerHTML;
  return trouve;
}
var minuteur = null;
q.addEventListener("input", function(){
  clearTimeout(minuteur);
  minuteur = setTimeout(chercher, 110);
});
/* Les ouvertures de tableau. La table des matieres les connait deja --
   ce sont ses entrees de premier rang -- et on s'en sert plutot que de
   les marquer une seconde fois dans la page. */
var ouvertures = {};
document.querySelectorAll("nav a.tt").forEach(function(a){
  ouvertures[a.dataset.ch] = 1;
});
var nulo = document.getElementById("nulo");
var gravuri = [].slice.call(document.querySelectorAll(".gravuro"));

function chercher(){
  var terme = sansAccent(q.value.trim());
  /* CE QUI NE REPOND PAS DISPARAIT, DE QUELQUE RANG QUE CE SOIT. La
     condition portait « && r.classList.contains("p") » : seuls les
     alineas etaient filtres, et les cent quarante-neuf titres du livre
     -- ouvertures de tableau et intertitres -- restaient a l'ecran quoi
     qu'on cherche. Deux alineas repondaient a « kranio », et l'on en
     voyait cent cinquante et un blocs ; une recherche sans reponse ne
     changeait rien du tout a la page, et l'on croyait le champ mort. Le
     rang d'un bloc ne dit pas s'il repond : seul son texte le dit. */
  var trouves = rangi.map(function(r, i){
    var trouve = false;
    [].slice.call(r.querySelectorAll(".k")).forEach(function(k, j){
      if (surligner(k, origine[i][j], terme)) trouve = true;
    });
    r.classList.toggle("for", !!terme && !trouve);
    r.classList.remove("tete");
    return trouve;
  });

  /* MAIS UN RESULTAT SANS SON TABLEAU NE SE SITUE PAS. On rend donc
     l'ouverture du tableau qui garde au moins une reponse : elle sert
     de titre courant a ses resultats. Une seule par tableau, et aucune
     pour les tableaux qui n'ont rien. */
  if (terme){
    var tete = null;
    rangi.forEach(function(r, i){
      // Si l'ouverture repond elle-meme, elle reste un resultat entier
      // et n'a pas a se replier sur son libelle.
      if (ouvertures[r.dataset.cle]) tete = trouves[i] ? null : r;
      else if (trouves[i] && tete){
        tete.classList.remove("for");
        tete.classList.add("tete");
        tete = null;
      }
    });
  }
  /* LES GRAVURES SE RETIRENT PENDANT LA RECHERCHE. Elles ne sont pas
     dans les rangs mais a cote d'eux, et le filtre les laissait donc en
     place : on cherchait un mot, les blocs disparaissaient, et les
     dix-neuf planches restaient a l'ecran, seules. Une planche fait
     douze cents points de large ; entre deux resultats elle les separe
     plus qu'elle ne les eclaire. La liste de resultats est une vue de
     TEXTE, et le tableau se regarde a sa place, dans la lecture. */
  gravuri.forEach(function(f){ f.classList.toggle("for", !!terme); });

  var rien = !trouves.some(function(v){ return v; });
  nulo.textContent = terme
    ? "Nula rezulto por « " + q.value.trim() + " »." : "";
  nulo.classList.toggle("mont", !!terme && rien);
  poserLangue(sel.value);
}

/* --- LE TABLEAU EN PLEIN ECRAN. Au clic, la gravure s'ouvre sur toute
   la fenetre, sans quitter la page. Ce n'est pas la vue d'ensemble qu'on
   y montre mais l'IMAGE DE DETAIL : c'est celle qu'on veut regarder de
   pres, et c'est la meme ou se decouperont les gros plans -- une fois
   chargee, elle ne l'est plus jamais. --- */
var plena = document.getElementById("plena");
var plenaBildo = document.getElementById("plena-bildo");
var plenaVenis = null;

function ouvrirPlena(fig){
  var url = fig.dataset.detalo;
  if (plenaBildo.getAttribute("src") !== url){
    plenaBildo.width = fig.dataset.dl;
    plenaBildo.height = fig.dataset.dh;
    /* La vue d'ensemble s'affiche le temps que le detail arrive : on ne
       reste pas devant un rectangle vide. */
    plenaBildo.src = fig.querySelector("img").currentSrc
                  || fig.querySelector("img").src;
    var grand = new Image();
    grand.onload = function(){ plenaBildo.src = url; };
    grand.src = url;
  }
  plenaVenis = fig.querySelector("img");
  plena.classList.add("mont");
  document.body.style.overflow = "hidden";
  document.getElementById("fermi").focus();
}
function fermarPlena(){
  plena.classList.remove("mont");
  document.body.style.overflow = "";
  if (plenaVenis) plenaVenis.focus({preventScroll:true});
}
document.addEventListener("click", function(e){
  var fig = e.target.closest ? e.target.closest(".gravuro") : null;
  if (fig){ ouvrirPlena(fig); return; }
  if (plena.classList.contains("mont")) fermarPlena();
});
addEventListener("keydown", function(e){
  if (e.key === "Escape" && plena.classList.contains("mont")) fermarPlena();
});

/* --- LE DEPLI DES NOTES. La note vit a la fin du document, cachee ;
   au clic, on la deplace sous l'alinea qui l'appelle, et un second
   clic la remet. On la DEPLACE au lieu de la copier : ainsi elle
   n'existe qu'une fois dans la page, et la recherche ne la trouve pas
   deux fois. --- */
document.addEventListener("click", function(e){
  var b = e.target.closest ? e.target.closest(".apel") : null;
  if (!b) return;
  var n = document.getElementById("noto-" + b.dataset.noto);
  if (!n) return;
  var ouvert = b.getAttribute("aria-expanded") === "true";
  if (ouvert){
    n.hidden = true;
    b.setAttribute("aria-expanded", "false");
  } else {
    var rang = b.closest(".r");
    if (rang && n.previousElementSibling !== rang)
      rang.parentNode.insertBefore(n, rang.nextSibling);
    n.hidden = false;
    b.setAttribute("aria-expanded", "true");
  }
});

/* --- LE GROS PLAN SUR UN NUMERO. Au clic sur « (12) », l'objet 12 de
   la planche parait sous l'alinea, agrandi.

   C'EST UN RECADRAGE, JAMAIS UN CHARGEMENT. On ne va pas chercher une
   image par numero : on prend celle de DETAIL de la planche — la meme
   qui sert au plein ecran — et l'on n'en montre qu'un morceau, en
   jouant sur « background-size » et « background-position ». Le
   premier gros plan d'un tableau la fait venir s'il ne l'est pas
   encore ; tous les suivants ne coutent rien du tout, et le plein
   ecran s'en sert aussi.

   LE CADRE SE CALCULE A L'OUVERTURE, non a la fabrication de la page :
   il depend de la largeur de la colonne, qui depend de la fenetre. On
   prend un carre de neuf hauteurs de chiffre autour du numero — assez
   pour que l'objet designe tienne dedans avec son entourage — puis on
   l'etire a la forme du cadre, sans jamais deformer l'image. --- */
document.addEventListener("click", function(e){
  var b = e.target.closest ? e.target.closest(".lupo") : null;
  if (b) { ouvrirLupo(b); return; }
  var k = e.target.closest ? e.target.closest(".lupo-vido") : null;
  if (k && k.dataset.par){
    var src = document.querySelector('[data-lupo="' + k.dataset.par + '"]');
    if (src) ouvrirLupo(src);
  }
});

var lupoN = 0;

function ouvrirLupo(b){
  var vide = b.nextElementSibling;
  if (b.getAttribute("aria-expanded") === "true"){
    var v = document.querySelector('.lupo-vido[data-par="' + b.dataset.lupo + '"]');
    if (v) v.remove();
    b.setAttribute("aria-expanded", "false");
    return;
  }
  var fig = document.querySelector('.gravuro[data-cle="' + b.dataset.g + '"]');
  if (!fig) return;
  var c = b.dataset.c.split(",").map(Number);   /* x, y, largeur, hauteur */
  var W = +fig.dataset.dl, H = +fig.dataset.dh;
  if (!W || !H) return;

  var rang = b.closest(".r");
  if (!rang) return;
  if (!b.dataset.lupo) b.dataset.lupo = "l" + (++lupoN);
  /* Un seul gros plan ouvert a la fois : deux vues de la meme planche
     l'une sous l'autre ne s'expliquent pas mieux que la premiere. */
  document.querySelectorAll(".lupo-vido").forEach(function(v){
    var s = document.querySelector('[data-lupo="' + v.dataset.par + '"]');
    if (s) s.setAttribute("aria-expanded", "false");
    v.remove();
  });

  var vue = document.createElement("div");
  vue.className = "lupo-vido";
  vue.dataset.par = b.dataset.lupo;
  var kadro = document.createElement("div");
  kadro.className = "kadro";
  var dir = document.createElement("div");
  dir.className = "dir";
  dir.innerHTML = '<span><b>(' + b.dataset.n + ')</b> ' +
    (b.getAttribute("title") || "") + '</span>' +
    '<span>' + b.dataset.g.slice(0, 3).toUpperCase().replace("T", "tabelo ")
      .replace(/^tabelo 0/, "tabelo ") + '</span>';
  vue.appendChild(kadro);
  vue.appendChild(dir);
  rang.parentNode.insertBefore(vue, rang.nextSibling);

  /* Le carre de source, en fractions de la planche. */
  var demi = 4.5 * c[3];                        /* 9 hauteurs de chiffre */
  var cx = c[0] + c[2] / 2, cy = c[1] + c[3] / 2;
  var lg = kadro.clientWidth, ht = kadro.clientHeight;
  var sh = Math.min(1, demi * 2);
  var sw = Math.min(1, (sh * H * lg) / (ht * W));  /* meme forme que le cadre */
  var sx = Math.min(1 - sw, Math.max(0, cx - sw / 2));
  var sy = Math.min(1 - sh, Math.max(0, cy - sh / 2));
  kadro.style.backgroundImage = 'url("' + fig.dataset.detalo + '")';
  kadro.style.backgroundSize = (100 / sw) + "% " + (100 / sh) + "%";
  kadro.style.backgroundPosition =
    (sw < 1 ? (sx / (1 - sw)) * 100 : 50) + "% " +
    (sh < 1 ? (sy / (1 - sh)) * 100 : 50) + "%";
  b.setAttribute("aria-expanded", "true");
}

/* --- L'INTITULE COURANT dans la table des matieres. On ne suit pas le
   defilement pixel par pixel : on observe les blocs de titre, et le
   dernier qui a passe le haut de la fenetre est celui qu'on lit. --- */
var titres = [].slice.call(document.querySelectorAll(".r.sub, .r.apar"));
var liens = {};
document.querySelectorAll("nav a").forEach(function(a){ liens[a.dataset.ch] = a; });
function courant(){
  var h = parseInt(getComputedStyle(document.documentElement)
            .getPropertyValue("--kapo")) || 104;
  var vu = null;
  titres.forEach(function(t){
    if (t.getBoundingClientRect().top - h - 14 <= 1) vu = t;
  });
  for (var c in liens) liens[c].classList.remove("nun");
  if (vu && liens[vu.dataset.cle]){
    liens[vu.dataset.cle].classList.add("nun");
    var a = liens[vu.dataset.cle], p = a.parentNode;
    if (a.offsetTop < p.scrollTop || a.offsetTop > p.scrollTop + p.clientHeight - 30)
      p.scrollTop = a.offsetTop - p.clientHeight / 2;
  }
}
addEventListener("scroll", function(){
  requestAnimationFrame(courant);
}, {passive:true});
courant();
</script>
</html>
