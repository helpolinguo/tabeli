<!-- LE BOUTON DE RETOUR VERS ido.help. Deux lignes seulement — cette
     feuille-ci et l'ancre en fin de document — et son apparence n'est
     dans aucune des deux : elle est dans /shared.css, servi depuis la
     racine du site, que les trois livres partagent. C'est ce qui
     garantit que le bouton est identique sur les trois, et que le
     retoucher se fait a un seul endroit.

     CES LIGNES ONT D'ABORD ETE POSEES DANS index.html, QUI EST UN
     FICHIER PRODUIT. La generation suivante les aurait effacees sans
     rien dire : html.py reecrit la page entiere a partir de ce
     gabarit. Elles sont donc ici, et nulle part ailleurs.

     TROIS FOIS LA LECON S'EST PAYEE, ET LE COMMENTAIRE CI-DESSUS ETAIT
     DEJA LA LES DEUX DERNIERES FOIS : le bouton de retour d'abord, puis
     « autocapitalize » sur le champ de recherche, puis ce script-ci,
     ajoute dans index.html juste SOUS ces lignes qui disent de ne pas
     le faire. Un fichier produit ne previent pas quand il oublie : la
     page continue de s'afficher, et le changement a disparu. -->
<link rel="stylesheet" href="/shared.css">
<script src="/shared.js" defer></script>
<style>
:root{--enk:#1a1a1a;--pap:#fbfaf7;--sub:#6b6560;--acc:#7a4b2a;--lin:#e2ddd5;
 --pap2:#f4f1ea;--flag:#b4552d;
 /* La hauteur des trois commandes de la barre. Voir « LES TROIS
    COMMANDES SONT UNE RANGEE » plus bas : elle est ici parce qu'elle
    vaut pour trois regles qui ne se touchent pas. */
 --kmd:42px}
@media(prefers-color-scheme:dark){:root{--enk:#e8e4de;--pap:#16161a;--sub:#9a938c;
 --acc:#d69a6a;--lin:#2c2c33;--pap2:#1c1c21;--flag:#e08a5c}}
*{box-sizing:border-box}
body{margin:0;background:var(--pap);color:var(--enk);
 font:16px/1.55 "Iowan Old Style",Palatino,"Palatino Linotype",Georgia,serif}

/* L'ANCRE S'ARRETE SOUS LA BARRE. La barre est « sticky » : elle
   recouvre le haut de la page, et un saut vers #t02-apar-1 amenait la
   cible a zero, donc DERRIERE elle -- le titre ido du tableau etait
   cache, et la lecture commencait au milieu du bloc. La barre se
   mesurait bien dans --kapo, mais cette mesure ne servait qu'a poser le
   volet lateral ; rien ne la retranchait du saut. Une seule declaration
   sur le conteneur de defilement suffit, et vaut pour toutes les cibles
   -- les blocs comme les lignes d'apparat, qui sont des <span>. */
html{scroll-padding-top:calc(var(--kapo,104px) + 12px)}

/* --- LA BARRE. Elle est glutinoza : ol restas sur la ecrano dum la
   lekto. Sua alteso ne esas fixa -- du lineo de titulo sur telefono --
   do la skripto mezuras ol e pozas ol en --kapo ; omna ancero haltas
   sub ol. --- */
header{position:sticky;top:0;background:var(--pap);border-bottom:1px solid var(--lin);
 padding:13px 20px 11px;z-index:20;

 /* --- THE HEADER FOLLOWS THE BODY. --------------------------------
    The band spans the whole width, and that is intended: its ground and
    the rule beneath it must go from edge to edge. But what it CARRIES
    must stop where the body stops. Otherwise, on a very wide viewport,
    the title and the search bar go on spreading while the two columns of
    text and their panel have already frozen at 1560px and centred. This
    was seen on a Vision Pro, whose viewport is far wider than any
    computer screen.

    The side inset is therefore 20 px while the viewport is narrow, then
    half of whatever overflows the 1560px of "main". The two boxes then
    coincide exactly, at every width beyond.

    It is placed AFTER the short form, which it replaces only on the two
    sides: a browser that does not know "max" discards this line and
    keeps the 20 px of the previous one, so that the header becomes what
    it was, breaking nothing. */
 padding-inline:max(20px, (100% - 1560px) / 2)}
.tito{display:flex;align-items:flex-start;gap:12px;justify-content:space-between}
h1{margin:0 0 2px;font-size:17px;font-weight:600;letter-spacing:.01em}
.sub{color:var(--sub);font-size:12.5px;margin-bottom:9px}
.dls{flex:none;display:flex;gap:7px}
.dl{display:inline-flex;align-items:center;gap:6px;text-decoration:none;
 border:1px solid var(--lin);border-radius:7px;padding:6px 11px;color:var(--acc);
 background:var(--pap);font-size:13px;font-weight:600;white-space:nowrap;
 transition:background .12s,border-color .12s}
.dl:hover{background:var(--lin);border-color:var(--acc)}
.dl svg{display:block;width:15px;height:15px;stroke:currentColor;fill:none;
 stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:700px){.dl span{display:none}.dl{padding:7px 9px}}
/* ET LE SOMMAIRE PERD SON MOT COMME LES TELECHARGEMENTS PERDENT LES
   LEURS. Le globe pose devant le nom de langue coute 21 px, et la barre
   d'un iPhone n'en avait pas 21 : elle passait a trois lignes des 402 px
   -- 218 px de haut au lieu de 170, sur une barre COLLANTE, donc autant
   de moins pour lire. « Materio » vaut 57 px et ne dit rien de plus que
   les trois barres qui le precedent, lesquelles ne sont d'aucune langue.
   On l'ote sous 700 px, ou les deux boutons de telechargement ont deja
   perdu « Ido » et « Francais » pour la meme raison. L'etiquette ARIA
   reste : ce qui disparait est le mot, non le nom. */
@media (max-width:700px){.tir span{display:none}}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* --- LES TROIS COMMANDES SONT UNE RANGEE, ET NON TROIS OBJETS.
   Elles etaient nees a trois moments differents et chacune s'etait
   reglee pour elle-meme. Mesure au navigateur, sur un iPhone :

     sommaire    32,5 px de haut   12,5 px / 600   system-ui   accent
     recherche   42,8 px de haut   16 px   / 400   serif       encre
     langue      38,0 px de haut   13 px   / 600   system-ui   encre

   Trois hauteurs, trois polices, trois graisses, et une des trois dans
   la couleur d'accent -- qui, dans cette feuille, signale un lien vers
   le dehors (les deux telechargements). Rien ne les tenait ensemble que
   leur bord et leur rayon.

   ON POSE DONC UN SOCLE, et chaque regle particuliere ne garde ensuite
   que ce qui lui est propre. La hauteur est celle du champ de recherche
   -- 42 px --, non par gout mais par contrainte : son corps est fixe a
   16 px pour empecher Safari de zoomer, et c'est ce corps qui commande
   sa hauteur. Les deux autres n'avaient aucune raison de rester plus
   basses ; 42 px fait de surcroit une cible tactile honnete.

   LA POLICE EST CELLE DU LIVRE, a 16 px. Le selecteur y perd 13 px de
   system-ui gras et gagne le serif du texte ; mesure : il passe de 172 a
   184 px de large, et la barre tient toujours sur deux lignes a 360 px.
   Douze pixels pour que les deux boites voisines soient de la meme
   main.

   LES ICONES SONT GRISES, LE TEXTE EST A L'ENCRE. L'accent reste ce
   qu'il etait : la marque de ce qui sort de la page. --- */
.tir,input[type=search],select#lg{
 height:var(--kmd);border:1px solid var(--lin);border-radius:7px;
 background:var(--pap);color:var(--enk);
 font-family:inherit;font-size:16px;font-weight:400;line-height:1}
.tir:focus-visible,input[type=search]:focus,select#lg:focus{
 outline:2px solid var(--acc);outline-offset:-1px}
/* L'icone d'une commande ne se lit pas comme son texte : elle dit ce que
   la commande FAIT, il dit ce qu'elle porte. D'ou le gris. */
.ikon{width:15px;height:15px;flex:none;pointer-events:none;
 stroke:var(--sub);fill:none;stroke-width:1.8;
 stroke-linecap:round;stroke-linejoin:round}

/* --- ET LE PLACEHOLDER NE DIT PAS DAVANTAGE QU'ON EST DEVANT UNE
   RECHERCHE. « Serchez en la du texti... » est en ido comme le reste de
   l'interface, et sur un telephone il sort coupe : « Serchez en la d ».
   Qui ne lit pas l'ido voit un cadre vide avec des mots inconnus dedans.
   Meme remede que pour le choix de langue, et pour la meme raison : une
   loupe, qui n'est d'aucune langue.
   Le champ passe dans une enveloppe pour la porter -- c'est l'enveloppe
   qui devient l'element souple de la barre, et le champ la remplit. Deux
   consequences a ne pas manquer : le « flex-basis » qui decide du retour
   a la ligne se pose desormais sur l'enveloppe, et le selecteur de
   langue, qui suivait le champ par « ~ », suit maintenant l'enveloppe --
   par « :focus-within », puisque le curseur est DANS elle et non SUR
   elle. --- */
.serc{position:relative;flex:1 1 240px;min-width:150px;
 display:flex;align-items:center}
.lupeto{position:absolute;left:11px}
input[type=search]{flex:1 1 auto;width:100%;min-width:0;padding:0 11px 0 32px}
/* 16px exacte, e ne min: Safari sur iPhone zomas automate sur irga
   kampo di qua la litero-grandeso esas sub 16px, kande onu tushas lu.
   La altra solvuro -- maximum-scale=1 -- impedus anke la zomo per la
   fingri, do la lekteblesa por qui bezonas lu. */
/* --- LE NOM D'UNE LANGUE NE DIT PAS QU'ON EST DEVANT UN CHOIX DE
   LANGUE. Le selecteur affiche la langue COURANTE, dans sa propre
   langue : « Francais » a l'ouverture, et c'est bien ainsi -- chacun
   reconnait le nom de la sienne dans la liste. Mais celui qui ne lit pas
   le francais voit alors un mot qu'il ne comprend pas, a cote d'une
   recherche et d'un sommaire : rien ne lui dit que c'est LA qu'on change
   de langue. L'etiquette ARIA ne l'aide pas non plus -- elle est en ido,
   et elle ne se voit pas.
   On pose donc devant le nom le seul signe qui ne soit d'aucune langue :
   un globe. Il est en SVG et non en emoji, comme les deux boutons de
   telechargement -- un emoji change de dessin d'un systeme a l'autre et
   ne suit pas la couleur du texte. Il ne prend pas le clic
   (« pointer-events:none ») : c'est le selecteur qui reste la cible,
   sur toute sa surface. --- */
.lgu{position:relative;flex:none;display:flex;align-items:center}
.glob{position:absolute;left:10px}
/* ET LE CHEVRON EST A NOUS, NON AU SYSTEME. Chaque navigateur dessine le
   sien : Safari empile deux fleches, Chrome pose un triangle. Deux
   dessins pour la meme commande, et aucun qui s'accorde aux deux icones
   voisines. « appearance:none » les ote, et l'on pose le chevron comme
   le globe -- meme trait, meme gris, meme taille, et sans prise au clic.
   Le selecteur reste la cible sur toute sa surface. */
.shevro{position:absolute;right:10px}
select#lg{flex:none;padding:0 32px 0 31px;cursor:pointer;
 appearance:none;-webkit-appearance:none}
/* LE CHOIX DE LANGUE TIENT SUR LA LIGNE DE LA RECHERCHE. Sur telephone
   il passait a la ligne pour lui seul : « Materio » plus la recherche
   plus le selecteur depassaient de quelques pixels la largeur d'un
   iPhone, et ce retour a la ligne enflait la barre -- 215px de haut au
   lieu de 170 -- qui mange d'autant la page, puisqu'elle est collante.
   Or le retour a la ligne se decide sur la largeur DE BASE, non sur la
   largeur minimale : c'est « flex-basis » qu'il faut baisser, et
   laisser ensuite la recherche s'etirer pour prendre ce qui reste. Le
   selecteur se retrouve ainsi a droite, sous les deux boutons de
   telechargement, et la barre tient sur deux lignes jusqu'a 360px.
   (« Jusqu'a 320px », disait cette ligne : mesure faite, la barre y
   passe a trois lignes -- 238px de haut -- et elle y passait deja avant
   qu'on y touche. Ce n'est pas un defaut nouveau, c'est un chiffre qui
   n'avait pas ete verifie.)
   CETTE REGLE VIENT APRES CELLES QU'ELLE CORRIGE. Une requete de media
   n'ajoute rien a la specificite : placee plus haut, elle perdait
   contre le « min-width:150px » de la recherche, et rien ne bougeait. */
@media (max-width:700px){
 .serc{min-width:0;flex:1 1 60px}
 input[type=search]{padding:0 8px 0 28px}
 .lupeto{left:9px}
 select#lg{padding:0 27px 0 27px}
 .glob{left:8px}.shevro{right:8px}
 .tir{padding:0 9px}}

/* --- LA RECHERCHE PREND TOUTE LA BARRE PENDANT QU'ON Y TAPE. Sur un
   telephone, les trois commandes se partagent une ligne de 370 px :
   « Materio » en prend une centaine, le selecteur de langue quatre-
   vingts, et il reste au champ de quoi montrer « Serchez e » -- le
   placeholder est coupe au dixieme caractere, et le mot qu'on tape
   defile dans une fenetre de deux centimetres. On rend donc au champ
   toute la barre le temps qu'il a le curseur, et on la lui reprend
   quand il le perd. La barre ne change pas de HAUTEUR : elle est
   collante, et une ligne de plus se paierait sur toute la page.

   LES VOISINS SE REPLIENT, ILS NE DISPARAISSENT PAS. « display:none »
   aurait fait sauter la barre et rendu la commande intouchable au
   milieu d'un geste ; une largeur nulle avec « overflow:hidden » se
   transitionne et laisse l'element dans le flux, donc dans l'ordre de
   tabulation.

   ET CHACUN DES DEUX SE REPLIE SUR SA PROPRE CONDITION. Le selecteur
   suit le champ (« ~ »), de sorte qu'il se rouvre des qu'on tabule
   dessus. Le bouton, lui, precede le champ et aucun selecteur ne
   remonte : il se replie sur « :focus-within » de la barre -- mais
   « :not(:focus) » le protege, sans quoi un utilisateur au clavier
   aurait mis le curseur sur un bouton devenu invisible. --- */
@media (max-width:700px){
 /* LA GEOMETRIE NE S'ANIME PAS, ET C'EST LE CORRECTIF. Elle s'animait :
    « max-width », « padding » et « border-width » passaient a zero en
    cent soixante millisecondes. Un iPhone montrait alors, a la gauche du
    champ elargi, un coin arrondi gris avec sa bordure -- et seulement au
    sommet de la page. La cause est la : ce n'est pas un repli rate, c'est
    l'ETAT INTERMEDIAIRE DE LA TRANSITION, fige. Mesure sur Chromium au
    format d'un iPhone, trente millisecondes apres la mise au foyer :
    largeur 23,56 px, opacite 0,90, bordure 1 px, marge interieure
    10,78 px -- l'image exacte de la capture d'ecran. Au sommet de la
    page, Safari n'a nulle part ou defiler quand le clavier monte : il
    redimensionne la fenetre visuelle, et ce changement de disposition
    interrompt la transition en cours. Plus bas dans la page il defile a
    la place, la transition va jusqu'au bout, et le coin ne parait pas.
    Une geometrie qui bascule en une seule image n'a pas d'etat
    intermediaire ou se faire surprendre, sur aucun moteur.
    L'OPACITE, ELLE, PEUT RESTER ANIMEE : meme surprise a mi-course, elle
    s'applique a une boite large de zero, sans bordure ni marge
    interieure, qui ne peint rien. */
 .bar .tir,.bar .lgu{transition:opacity .16s}
 /* LE « gap » DE LA BARRE SURVIT AU REPLI. Un element de largeur nulle
    reste un element : les dix pixels qui le separaient de son voisin
    restent la, et le champ « pleine largeur » commencait a vingt-huit
    pixels du bord au lieu de vingt. La marge negative les reprend, des
    deux cotes. */
 .bar:focus-within .tir:not(:focus),
 .serc:focus-within ~ .lgu{
  max-width:0;width:0;min-width:0;flex-basis:0;
  padding-left:0;padding-right:0;border-width:0;
  opacity:0;overflow:hidden}
 .bar:focus-within .tir:not(:focus){margin:0 -10px 0 0}
 .serc:focus-within ~ .lgu{margin:0 0 0 -10px}
 /* « min-width:0 » N'EST PAS UNE REDONDANCE. La taille minimale
    AUTOMATIQUE d'un element de boite flexible est celle de son contenu,
    et cette minimale l'emporte sur « max-width » : une largeur nulle ne
    peut donc rien contre elle. La regle veut qu'elle retombe a zero des
    que l'element porte un « overflow » autre que « visible » -- ce que
    fait Chromium, qui rend bien 0,00 px --, mais on ne se repose pas sur
    une resolution automatique pour un effet qu'on peut demander.
    Signale sur un iPhone : le bouton du sommaire laissait voir un coin
    arrondi de six pixels a la gauche du champ elargi.
    ET LE CONTENU DU BOUTON SE RETIRE AVEC LUI. L'icone mesure 15 px et
    ne se laisse pas comprimer (« flex:none ») : dans une boite de
    largeur nulle, elle ne tient que par le rognage. Un rognage qui ne se
    fait pas est invisible dans le code et bien visible a l'ecran ; on
    ote donc ce qu'il y a a rogner. Le bouton, lui, reste dans le flux et
    dans l'ordre de tabulation -- et « :not(:focus) » lui rend son icone
    des qu'on l'atteint au clavier. Le selecteur de langue, dont l'enfant
    est le champ focalisable lui-meme, ne peut pas recevoir le meme
    traitement : lui n'a que la geometrie. */
 .bar:focus-within .tir:not(:focus) > *{display:none}}
.tir{display:none;flex:none;align-items:center;gap:7px;
 padding:0 12px;cursor:pointer}
.tir:hover{background:var(--lin)}

/* --- DU PANELI, ne tri. La Kompleta Gramatiko havas anke panelo dextra
   por la chefa vorti ; ca libro ne havas oli, e la loko qua restas
   servas la DU KOLONI DI TEXTO, qui bezonas ol. --- */
main{display:grid;grid-template-columns:250px minmax(0,1fr);
 max-width:1560px;margin:0 auto;gap:0}
nav{position:sticky;top:var(--kapo,104px);height:calc(100vh - var(--kapo,104px));
 overflow-y:auto;padding:16px 14px 60px;font-family:system-ui,sans-serif;
 font-size:13px;border-right:1px solid var(--lin)}
nav .parto{margin:14px 0 5px;font-size:11px;letter-spacing:.07em;
 text-transform:uppercase;color:var(--sub);font-weight:700}
nav a{display:block;padding:3px 6px;border-radius:5px;text-decoration:none;
 color:var(--enk);line-height:1.35;font-size:12.5px}
/* Deux rangs dans la table : le tableau, et ses intertitres. Seize
   tableaux et quatre-vingts intertitres a plat seraient illisibles. */
/* Trois rangs, parce que le livre en a trois : le tableau, la scene,
   l'intertitre. Seize tableaux et cent quarante intertitres a plat
   seraient une liste, non une table. */
nav a.tt{margin-top:13px;font-size:12.5px;font-weight:600}
nav a.tt b{color:var(--acc);font-weight:700}
nav a.sc{padding-left:14px;font-size:12px;font-style:italic}
nav a.st{padding-left:26px;color:var(--sub);font-size:12px}
nav a.st:hover,nav a.sc:hover{color:var(--enk)}
nav a:hover{background:var(--lin)}
nav a.nun{color:var(--acc);font-weight:700;background:rgba(122,75,42,.07)}

/* LE BLANC LATERAL DOIT LOGER LE FOLIO. Il se pose HORS de sa colonne
   -- 30px a gauche pour l'ido, 28px a droite pour la traduction -- et
   ce blanc-ci est tout ce qu'il a pour s'y tenir. A 26px il en manquait
   deux a droite : la page depassait la fenetre de 2px, et l'on pouvait
   la faire glisser lateralement. Cela ne se voyait qu'entre 1181px --
   sous quoi le folio rentre dans le flux -- et 1600px, ou les marges
   automatiques de « main » finissent par absorber le debordement ;
   d'ou une gene qui paraissait aller et venir sans raison. */
#kont{padding:22px 32px 140px}

/* --- LA DU KOLONI. Grid e ne du kolumni flotanta : la du celi di un
   rango devas komencar ye la sama alteso, e nur grid garantias to
   kande la texti havas diferanta longeso -- to qua eventas sempre,
   nam la du edituri ne dicas la sama kozo per la sama nombro di vorti.
   La linio inter la koloni esas la limito : ol montras ke la du texti
   esas la sama alineo, ne du alinei sucedanta. --- */
.r{display:grid;grid-template-columns:1fr 1fr;gap:0 34px;
 align-items:start;position:relative}
.r+.r{margin-top:.62em}
.k{position:relative;min-width:0;text-align:justify;hyphens:auto;
 -webkit-hyphens:auto}
.k.io{padding-right:17px;border-right:1px solid var(--lin)}
.k.tra{padding-left:0}
.r.sub .k,.r.apar .k{text-align:center}
/* LE TITRE SE CENTRE SUR LA COLONNE, NON SUR CE QUI RESTE DE LA COLONNE.
   La case ido porte 17px de marge et 1px de filet A DROITE, pour poser la
   ligne de partage ; sa boite de contenu est donc de 18px plus etroite que
   la case francaise, et « text-align:center » centrait dans cette boite-la.
   Les deux titres d'un meme rang tombaient ainsi a 9px l'un de l'autre --
   toujours 9, a toute largeur, et que le folio paraisse ou non : ce n'est
   pas lui qui decalait, c'est le filet. On rend a la case ido, pour les
   seuls rangs centres, un blanc egal a gauche : le titre retrouve l'axe de
   sa colonne, et le filet ne bouge pas.

   « QUE LE FOLIO PARAISSE OU NON » N'ETAIT VRAI QU'EN LARGE, et la mesure
   qui l'affirmait n'avait ete faite qu'en large. Sous 1180px le folio
   quitte la marge et devient un flottant : il decale alors bel et bien, et
   d'un ecart different a chaque rang. Voir la derniere regle de cette
   feuille, qui repare cela ; celle-ci ne vaut que pour la mise en deux
   colonnes. */
.r.sub .k.io,.r.apar .k.io{padding-left:18px}
.vaka{}
/* La celo vakua ne esas eroro : ol dicas ke ta alineo ne existas en
   l'altra edituro. Guignon dividis per intertitli un texto quan
   Rochelle laisas kurar ; la vakuo esas la diferenco mem, e la kasar
   igus la du koloni mentiar. */
.k.tra.vaka::after{content:"—";color:var(--lin);font-size:13px}
.r.sub .k.tra.vaka::after{content:""}
/* « dif » : la case attend sa traduction, elle ne manque pas. */
.k.tra.vaka.dif::after{content:""}

/* --- L'ARABE VA DE DROITE A GAUCHE, et c'est la CASE qui le dit, non
   la page : les six autres colonnes gardent leur sens. L'attribut
   « dir » suffit au navigateur pour l'ordre des mots et pour la
   ponctuation -- « (13) » se range du bon cote du substantif tout
   seul -- mais trois choses de la mise en page restent a retourner.
   Le folio d'abord : il se pose hors de la colonne, a droite pour une
   traduction, et il doit passer a gauche quand la colonne se lit a
   l'envers, sans quoi il tombe SUR le debut des lignes. L'alinea
   ensuite, qui se rentre a droite. La bordure du mode etroit enfin,
   qui separe les deux textes et doit rester du cote ou l'arabe
   commence. Les logical properties auraient tout fait d'un coup ;
   « left » et « right » sont deja partout ailleurs dans cette
   feuille, et melanger les deux familles se relit mal. */
.k.tra[dir=rtl]{text-align:justify}
/* UN INTERTITRE SE CENTRE AUSSI QUAND LA COLONNE SE LIT A L'ENVERS. La
   ligne ci-dessus compte un attribut de plus que « .r.sub .k{text-align:
   center} » et l'emportait donc partout, y compris sur les rangs
   centres : les six colonnes de droite a gauche -- ar, arz, apc, fa, ur,
   pnb -- collaient leurs 162 titres au bord droit, a toute largeur,
   depuis le jour ou l'arabe est entre. Ce n'etait pas visible d'un coup
   d'oeil, parce qu'un titre colle a droite dans une colonne qui se lit a
   droite a l'air d'etre a sa place. Il ne l'est pas : en face, le titre
   ido est centre. */
.r.sub .k.tra[dir=rtl],.r.apar .k.tra[dir=rtl]{text-align:center}
.k.tra[dir=rtl] .fol{left:-28px;right:auto}
.r.p .k.tra[dir=rtl]{text-indent:1.3em}
.k.tra[dir=rtl] sup{margin-left:0;margin-right:.08em}

.r.p .k{text-indent:1.3em}
.r.sub{margin:1.9em 0 .9em}
.r.sub .k{font-variant:small-caps;letter-spacing:.06em;font-weight:600;
 text-indent:0;color:var(--enk)}
.r.apar{margin:.4em 0 1.8em}
.r.apar .k{text-indent:0;line-height:1.5}
.ln{display:block;letter-spacing:.09em;margin:.28em 0}
.ln.lg{font-weight:700;letter-spacing:.01em;font-size:1.32em;margin:.42em 0}

/* --- LE ROLE HABILLE LA LIGNE, NON LA MACRO. Les deux volumes ne
   composent pas de la meme facon ce qui joue le meme role : le titre du
   tableau 8 passe par \VUpk cote ido et par \VUtitre cote francais, de
   sorte que la page donnait « La Rekolto. » en corps de texte en face
   d'un « La Moisson. --- Les aspects de la campagne. » en gros et gras ;
   et la scene etait italique d'un cote, romaine de l'autre. Le PDF garde
   chaque fac-simile tel qu'il est ; la page de lecture, elle, sert a
   COMPARER, et deux choses qui se repondent doivent se ressembler. Ces
   regles viennent APRES « .ln » et « .ln.lg », qu'elles annulent : a
   specificite egale, c'est la derniere qui l'emporte. --- */
/* « font-variant:normal » des la base : la cellule d'un intertitre
   porte « small-caps », et un titre de tableau loge dans un intertitre
   -- tableaux 7, 9, 14, 15 -- en heritait, si bien qu'il sortait en
   petites capitales quand celui du tableau 10 sortait en gras. C'est
   « sekc » qui redemande les petites capitales, et lui seul. */
.k [data-rolo]{display:block;font-style:normal;font-weight:400;
 font-variant:normal;font-size:1rem;letter-spacing:.04em;margin:.3em 0}
/* L'italique du releve ne decide plus : le role s'en charge. Sans quoi
   « Unesma ceno. », compose en italique par Guignon, restait penche en
   face d'un « Première scène. » droit. */
.k [data-rolo] i,.k [data-rolo] em{font-style:inherit}
.k [data-rolo="avan"]{font-size:.9rem;color:var(--sub);letter-spacing:.09em}
.k [data-rolo="serio"]{font-size:.82rem;color:var(--sub);letter-spacing:.14em;
 text-transform:uppercase;margin:.7em 0 .35em}
.k [data-rolo="nom"]{font-weight:700;font-size:1.32rem;letter-spacing:.02em;
 margin:.45em 0 .3em}
.k [data-rolo="tit"]{font-weight:700;font-size:1.1rem;letter-spacing:.02em;
 margin:.12em 0}
/* LE TITRE D'UNE SCENE. Il se composait en section, si bien qu'il
   changeait de taille d'un tableau a l'autre -- gras au tableau 7, ou
   il tient lieu de titre du tableau, petites capitales au tableau 3, ou
   il n'en tient pas lieu. C'est pourtant la meme chose. Il a donc son
   rang a lui, entre le titre du tableau et l'intertitre. */
.k [data-rolo="titceno"]{font-weight:700;font-size:1rem;letter-spacing:.02em;
 margin:.15em 0 .3em}
/* Les lignes d'un meme titre se relisent d'un trait : « inline-block »
   les met sur une ligne sans leur oter leurs marges, et le liant -- le
   tiret ou l'espace -- est pose dans le texte par rendre(). */
.k [data-kunligita]{display:inline-block;margin-top:0;margin-bottom:0}
.k [data-rolo="ceno"]{font-style:italic;font-variant:normal;font-size:.88rem;
 letter-spacing:.03em;margin:.55em 0 .25em}
.k [data-rolo="sekc"]{font-variant:small-caps;font-weight:600;font-size:.85rem;
 letter-spacing:.07em;margin:.45em 0 .25em}
.k [data-rolo="subt"]{font-style:italic;font-size:.78rem;color:var(--sub);
 letter-spacing:.02em;margin:.1em 0 .35em}

/* L'INTERTITRE QUE LE LIVRET FRANCAIS N'A PAS. Il vient de l'ido, il
   est de nous, et il doit se voir tel : meme corps et meme place que
   les autres -- la colonne resterait boiteuse a le composer autrement
   --, mais un crochet de chaque cote, discret, qui dit l'ajout. C'est
   la convention des editions diplomatiques, et elle ne coute qu'un
   caractere. L'infobulle donne le reste. */
.apud::before{content:"[";color:var(--sub);font-weight:400}
.apud::after{content:"]";color:var(--sub);font-weight:400}
.fil{display:block;width:52px;height:1px;background:var(--lin);
 margin:.85em auto}
.orn{display:block;color:var(--sub);margin:.5em 0;font-size:.9em}

/* La folio se pose EN DEHORS du texte, dans le blanc de gauche de sa
   colonne : il ne doit ni entrer dans la justification ni la reduire.
   Sur ecran etroit — ou les deux colonnes s'empilent — il rentre dans
   le flux, faute de blanc ou se mettre. */
/* « text-indent:0 » n'est pas un detail. L'alinea porte
   « text-indent:1.3em », et le folio, qui est un bloc dans cette
   colonne, en HERITAIT : son numero se trouvait pousse de 21px vers la
   droite sur les alineas, et restait au bord sur les titres et les
   ouvertures, qui n'ont pas d'alinea. Le numero semblait donc filer
   vers la gauche des qu'on quittait un paragraphe -- alors qu'il ne
   bougeait pas : c'etaient les autres qui etaient de trop a droite. */
.fol{position:absolute;left:-30px;top:.15em;font:600 11px/1 system-ui,sans-serif;
 color:var(--sub);text-decoration:none;padding:2px 3px;border-radius:3px;
 text-indent:0}
.fol:hover{color:var(--acc);background:var(--lin)}
.k.tra .fol{left:auto;right:-28px}
@media (max-width:1180px){
 .fol{position:static;float:left;margin:.2em .5em 0 0}
 .k.tra .fol{float:right;margin:.2em 0 0 .5em}
 .k.tra[dir=rtl] .fol{float:left;margin:.2em .5em 0 0}}

/* --- LA NOTE SE REPLIE. Au bas d'une page imprimee la note a sa
   place ; dans une colonne qui defile, posee entre deux alineas, elle
   coupe la lecture. L'appel devient donc un bouton, et la note s'ouvre
   sous l'alinea qui la porte -- comme dans la page du Kompleta
   Gramatiko. C'est un <button> et non un <a> : il ne mene nulle part,
   il montre et il cache ; le clavier et les lecteurs d'ecran le
   comprennent ainsi, et aria-expanded le leur dit. --- */
/* L'EXPOSANT GARDE SA BOITE. « vertical-align:super » avec
   « line-height:0 » la reduisait a zero de haut : le glyphe debordait
   seul, le pointille lui passait au travers, et l'etat ouvert -- fond
   « --acc », texte « --pap » -- n'avait plus rien ou se peindre. Le
   marqueur devenait creme sur creme, donc invisible au clic. On garde
   donc une boite pleine et on remonte l'exposant par un decalage
   relatif, qui ne compte pas dans la ligne : les interlignes du releve
   ne bougent pas d'un pixel. */
.apel{font:inherit;font-size:.72em;line-height:1;position:relative;top:-.42em;
 background:none;border:0;padding:0 .12em;margin:0;cursor:pointer;
 color:var(--acc);font-weight:600;border-bottom:1px dotted var(--acc)}
.apel:hover{background:var(--lin)}
/* Une bordure transparente, et non « 0 » : les deux etats font alors la
   meme hauteur, et le mot ne tressaute pas quand la note s'ouvre. */
.apel[aria-expanded=true]{background:var(--acc);color:var(--pap);
 border-radius:3px;border-bottom:1px solid transparent}
.noto{margin:.5em 0 .7em;padding:.6em .8em;border-left:2px solid var(--acc);
 background:var(--pap2);font-size:13.5px;line-height:1.5;color:var(--sub);
 border-radius:0 5px 5px 0}
.noto b{color:var(--enk)}

/* LE GROS PLAN SUR UN NUMERO. Le renvoi « (12) » garde exactement
   l'aspect qu'il avait — meme corps, meme exposant, meme place dans la
   ligne — et ne se signale que par un souligne pointille : la page ne
   doit pas se couvrir de boutons. Ceux dont on ne connait pas la
   position sur la planche restent du texte, sans souligne. */
.lupo{font:inherit;background:none;border:0;padding:0;margin:0;
 cursor:zoom-in;color:inherit;line-height:inherit}
.lupo sup, .lupo.nuda{border-bottom:1px dotted var(--acc)}
.lupo:hover sup, .lupo.nuda:hover{background:var(--lin)}
.lupo[aria-expanded=true] sup, .lupo.nuda[aria-expanded=true]{
 background:var(--acc);color:var(--pap);
 border-radius:3px;border-bottom-color:transparent}
/* UN RENVOI PEUT EN VALOIR TROIS. « Les tableaux muraux (9, 11, 12) »
   nomme trois objets a la fois ; chaque numero y est cliquable pour son
   compte, tandis que les parentheses et les virgules restent du texte.
   Le bouton est alors NU -- il n'a pas d'exposant a lui, se trouvant
   deja dans celui du groupe -- et porte donc lui-meme le pointille.

   LA HAUTEUR DE LIGNE DOIT ETRE RENDUE AU BOUTON NU. Un exposant porte
   « line-height:0 » pour ne pas ecarter les lignes du paragraphe ; le
   bouton, qui en herite, se retrouve avec une boite haute d'un point,
   et son pointille tombe alors AU MILIEU des chiffres au lieu de passer
   dessous -- cinq points trop haut, mesure faite. « normal » lui rend sa
   boite : elle retombe exactement sur celle des autres renvois, et
   l'interligne du paragraphe ne bouge pas d'un point. */
.lupo.nuda{font:inherit;line-height:normal}
/* Le gros plan se pose sous l'alinea, comme une note : c'est la meme
   idee, montrer sans quitter sa ligne. */
/* LA VUE EST PANORAMIQUE, ET C'EST VOULU. Sa HAUTEUR est fixe — donc
   le grossissement aussi, neuf hauteurs de chiffre quelle que soit la
   fenetre — et sa largeur prend tout ce que la page lui donne. Une
   fenetre large montre donc plus de la scene autour de l'objet, au
   meme grossissement ; une fenetre etroite en montre moins. C'est la
   scene qui explique l'objet, non l'objet seul. */
.lupo-vido{margin:.5em 0 .8em;border-left:2px solid var(--acc);
 background:var(--pap2);border-radius:0 5px 5px 0;overflow:hidden}
/* ET LA VUE SE DEPLACE. Le gros plan tombe sur l'objet nomme, mais
   l'oeil veut souvent voir a cote — ce qu'il y a au bout du comptoir,
   qui est le voisin de gauche. On tire donc la vue au doigt ou a la
   souris, comme une carte. « touch-action:none » est ce qui le rend
   possible au doigt : sans lui le navigateur prend le glissement pour
   un defilement de page et ne nous en dit rien. */
.lupo-vido .kadro{width:100%;height:250px;background-repeat:no-repeat;
 background-color:var(--pap2);cursor:grab;touch-action:none;
 -webkit-user-select:none;user-select:none}
.lupo-vido .kadro.tiras{cursor:grabbing}
.lupo-vido .dir{display:flex;justify-content:space-between;gap:1em;
 padding:.42em .8em;font-size:12.5px;color:var(--sub);
 border-top:1px solid var(--lin)}
.lupo-vido .dir b{color:var(--enk);font-weight:600}
@media (max-width:900px){.lupo-vido .kadro{height:190px}}

/* LA JOINTURE. Rochelle coupe parfois en deux un alinea que Guignon
   laisse d'un tenant. Le PDF garde chaque edition telle quelle ; ici
   les deux moities sont recollees pour que les rangs se repondent, et
   ce filet dit ou l'autre edition allait a la ligne. Un simple blanc
   se lisait comme une coquille. */
.nal{display:inline-block;width:1.1em;margin:0 .25em;
 border-left:1px solid var(--lin);height:.85em;vertical-align:-.05em}

b{font-weight:700}
sup{font-size:.66em;line-height:0;color:var(--sub);font-weight:400}
.k.io sup,.k.tra sup{margin-left:.08em}

/* --- LE TABLEAU MURAL. Le livret decrit une gravure que le lecteur de
   1926 avait au mur ; la page la lui rend, au-dessus du texte qu'elle
   illustre. Elle ne se charge QUE lorsqu'elle approche du champ --
   « loading=lazy » --, et ses dimensions sont ecrites dans la balise :
   la place est donc reservee des le depart, et le texte ne sursaute pas
   quand l'image arrive. --- */
.gravuro{margin:2.2em 0 .6em;text-align:center}
.gravuro img{width:100%;max-width:1246px;height:auto;/* La gravure remplit son cadre : sans largeur declaree, elle s'arretait
   a sa taille propre et « sizes » annoncait alors une largeur qu'elle
   n'occupait pas -- le navigateur choisissait de travers. */
 border:1px solid var(--lin);
 border-radius:3px;background:var(--pap2);cursor:zoom-in;
 box-shadow:0 1px 4px rgba(0,0,0,.10);transition:box-shadow .15s}
.gravuro img:hover{box-shadow:0 2px 10px rgba(0,0,0,.18)}
@media (prefers-color-scheme:dark){.gravuro img,.gravuro img:hover{box-shadow:none}}

/* --- LE PLEIN ECRAN. Un tableau mural se regarde de pres ; la colonne
   de lecture est trop etroite pour cela. Au clic il s'ouvre sur toute
   la fenetre, SANS quitter la page -- ni nouvel onglet, ni nouvelle
   requete : c'est l'image de detail, celle-la meme ou se decouperont
   les gros plans, et une fois chargee elle ne l'est plus jamais.
   La transition porte sur l'opacite et sur une legere echelle : c'est
   assez pour que l'oeil suive l'ouverture sans que rien ne saute.
   « prefers-reduced-motion » la coupe pour qui n'en veut pas. --- */
.plena{position:fixed;inset:0;z-index:50;display:flex;align-items:center;
 justify-content:center;background:rgba(20,18,16,.94);
 opacity:0;visibility:hidden;transition:opacity .22s ease,visibility .22s;
 padding:18px;overflow:hidden;touch-action:none}
.plena.mont{opacity:1;visibility:visible}
/* « -webkit-user-drag » N'EST PAS UN ORNEMENT. Sans lui, tirer sur une
   image lance le glisser-deposer du navigateur, qui coupe le suivi du
   pointeur au deuxieme mouvement : la vue avancait d'un pas puis se
   figeait. */
.plena img{max-width:100%;max-height:100%;object-fit:contain;
 transform:scale(.97);transition:transform .22s ease;border-radius:2px;
 cursor:zoom-in;-webkit-user-select:none;user-select:none;
 -webkit-user-drag:none}
.plena.mont img{transform:scale(1)}
/* UNE FOIS AGRANDIE, L'IMAGE SE TIRE. Le curseur le dit, et la
   transition s'efface : elle est bonne pour l'ouverture, elle
   traineraient derriere le doigt. */
.plena.prox img{cursor:grab;transition:none}
.plena.prox.tiras img{cursor:grabbing}
.plena .fermi{position:absolute;top:12px;right:16px;border:0;background:none;
 color:#f2ede6;font:600 26px/1 system-ui,sans-serif;cursor:pointer;padding:6px 10px;
 z-index:2}
/* LES BOUTONS DE GROSSISSEMENT, pour qui n'a ni molette ni deux doigts.
   Ils disent aussi que la vue s'agrandit : sans eux rien ne l'annonce. */
.plena .lupili{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);
 display:flex;gap:2px;background:rgba(0,0,0,.42);border-radius:6px;
 padding:3px;z-index:2}
.plena .lupili button{border:0;background:none;color:#f2ede6;cursor:pointer;
 font:600 17px/1 system-ui,sans-serif;padding:7px 13px;border-radius:4px}
.plena .lupili button:hover{background:rgba(255,255,255,.16)}
.plena .lupili .grado{font-weight:400;font-size:12.5px;padding:8px 6px;
 min-width:3.4em;text-align:center;opacity:.82;pointer-events:none}
@media (prefers-reduced-motion:reduce){
 .plena,.plena img{transition:none}}

/* La recherche : ce qui ne correspond pas disparait, et l'accord se
   marque dans le texte meme. Le surlignage se pose sur un <mark>
   fabrique par le script, jamais dans la source. */
mark{background:rgba(180,85,45,.22);color:inherit;border-radius:2px}
.for{display:none}
/* L'ouverture du tableau reste au-dessus de ses resultats, pour qu'on
   sache OU l'on a trouve. Mais elle n'est pas un resultat : on la
   reduit a son libelle -- numero et titre, que le script a depose dans
   data-tete -- au lieu d'etaler les quatre lignes de son apparat, page
   de serie et sous-titres de lecons comprises, au-dessus de deux
   alineas. */
.r.apar.tete{display:block;margin:1.6em 0 .1em;padding-bottom:.3em;
 border-bottom:1px solid var(--lin);text-align:left}
.r.apar.tete>*{display:none}
.r.apar.tete::before{content:attr(data-tete);display:block;color:var(--acc);
 font:600 13px/1.4 system-ui,sans-serif;letter-spacing:.02em}
/* Une recherche sans reponse doit se voir : sans cela la page reste
   simplement vide, et l'on croit a une panne. */
.nulo{display:none;padding:2.6em 20px;color:var(--sub);text-align:center;
 font-size:14.5px}
.nulo.mont{display:block}

/* --- SUR ECRAN ETROIT les deux colonnes s'empilent : l'ido d'abord,
   la traduction dessous, avec un filet a gauche pour qu'on voie du
   premier coup d'oeil laquelle on lit. Le paralelismo resta lisible
   parce que chaque rango garde son bloc. --- */
@media (max-width:900px){
 main{grid-template-columns:1fr}
 nav{position:fixed;left:0;top:var(--kapo,150px);bottom:0;width:270px;
  background:var(--pap);z-index:15;transform:translateX(-100%);
  transition:transform .18s;box-shadow:0 0 24px rgba(0,0,0,.14)}
 nav.mont{transform:none}
 .tir{display:flex}
 #kont{padding:18px 16px 120px}
 .r{grid-template-columns:1fr;gap:.35em 0}
 .k.io{padding-right:0;border-right:0}
 .k.tra{padding-left:11px;border-left:2px solid var(--lin);color:var(--sub)}
 .k.tra[dir=rtl]{padding-left:0;padding-right:11px;
  border-left:0;border-right:2px solid var(--lin)}
 .r.sub .k.tra,.r.apar .k.tra{border-left:0;padding-left:0}
 .r.sub .k.io,.r.apar .k.io{padding-left:0}}
@media (max-width:900px) and (prefers-color-scheme:dark){
 nav{box-shadow:0 0 24px rgba(0,0,0,.6)}}

/* --- UN FLOTTANT NE SE CONTENTE PAS DE SE PLACER : IL RACCOURCIT LA
   LIGNE. Sous 1180px le folio n'a plus de marge ou se poser et devient un
   flottant. Sur un alinea justifie cela ne se voit pas : le texte
   contourne le numero, puis reprend toute sa largeur. Sur un INTERTITRE,
   si -- « text-align:center » centre alors le titre dans ce qui RESTE de
   la ligne, et non dans la colonne. Le titre ido part vers la droite de la
   moitie de son folio, le titre francais vers la gauche de la moitie du
   sien, et un rang dont le titre ne porte pas de folio reste, lui, bien
   centre : d'ou un desalignement qui parait capricieux et ne l'est pas.

   Releve sur la capture d'un iPhone 16 (402pt, densite 3), en mesurant
   l'encre elle-meme : axe de la colonne a 603 ; « Detaloza deskripto. »
   centre a 628 et « La bona lernanti. » a 627,5 -- +8,3px ; « II.
   Description detaillee. » a 570 -- -11px ; « [Les bons eleves.] », qui
   n'a pas de folio, a 601 -- juste. Puis au navigateur, sur les 148 rangs
   centres : 184 titres hors axe a 390px, 194 a 700px, 180 a 1000px, 0 a
   1400px. L'ecart dominant n'est pas 9px mais 12,8px, parce qu'il vaut la
   moitie du folio et qu'un folio compte de un a trois chiffres.

   ON REND DONC AU FOLIO SA POSITION ABSOLUE POUR LES SEULS RANGS CENTRES.
   Hors du flux, il ne raccourcit plus rien, et le titre retrouve l'axe de
   sa colonne sans compensation -- une compensation aurait du suivre le
   nombre de chiffres.

   ET L'ON CREUSE UNE GOUTTIERE EGALE DES DEUX COTES pour l'y loger.
   Absolu, le folio ne pousse plus le texte : il passe DESSOUS. Mesure
   faite, trois rangs le rencontraient -- t06-apar-2 et t08-tit-6 --, ce
   qui ne se voyait pas tant que le flottant ecartait le texte. Une
   gouttiere symetrique ne deplace pas l'axe, par construction ; elle coute
   8 rangs plus longs sur 148 a 390px, et ce sont justement les titres les
   plus larges, ceux qui touchaient le folio. On paie donc la ou il fallait
   payer.

   CE BLOC EST LE DERNIER DE LA FEUILLE, ET C'EST VOULU. La requete de
   900px, plus haut, remet a zero les blancs des rangs centres ; ecrite
   avant elle, la gouttiere aurait ete effacee sur les telephones -- c'est
   a dire partout ou le defaut se voit. --- */
@media (max-width:1180px){
 .r.sub .k .fol,.r.apar .k .fol{position:absolute;float:none;margin:0;
  top:.15em}
 .r.sub .k.io .fol,.r.apar .k.io .fol{left:0;right:auto}
 .r.sub .k.tra .fol,.r.apar .k.tra .fol{left:auto;right:0}
 /* L'ARABE REPREND TOUT EN ENTIER, ET NON LE SEUL COTE. La regle
    « .k.tra[dir=rtl] .fol » compte un attribut de plus et l'emporte donc
    sur « .r.sub .k .fol » : le folio d'une colonne de droite a gauche
    redevenait flottant, et 162 de ses titres repartaient hors axe alors
    que les 332 du francais etaient justes. On y redit donc tout. */
 .r.sub .k.tra[dir=rtl] .fol,.r.apar .k.tra[dir=rtl] .fol{position:absolute;
  float:none;margin:0;top:.15em;left:0;right:auto}
 /* En deux colonnes la case ido garde 17px de marge et 1px de filet a
    droite : sa gouttiere de gauche vaut donc 26+18, celle de droite
    26+17, et l'axe reste au milieu. */
 .r.sub .k.io,.r.apar .k.io{padding-left:44px;padding-right:43px}
 .r.sub .k.tra,.r.apar .k.tra{padding-left:26px;padding-right:26px}}
/* Sous 900px les colonnes s'empilent, le filet passe a gauche de la
   traduction et la case ido n'a plus rien a compenser : les quatre
   gouttieres sont egales. */
@media (max-width:900px){
 .r.sub .k.io,.r.apar .k.io,.r.sub .k.tra,.r.apar .k.tra{
  padding-left:26px;padding-right:26px}
 /* Meme raison qu'au-dessus : « .k.tra[dir=rtl] » pose ici 11px a droite
    et rien a gauche, pour son filet, et l'emporte sur « .r.sub .k.tra ».
    Un rang centre n'a pas de filet ; il a deux gouttieres egales.

    ET LE FILET AVEC. La regle voisine ote « border-left » aux rangs
    centres, parce qu'un intertitre n'est pas un alinea a apparier : il
    n'a rien a separer. Elle ne l'otait qu'a gauche, si bien que les six
    colonnes de droite a gauche gardaient leur barre de 2px la ou les
    quarante-trois autres ne l'avaient pas -- et cette barre, comptee dans
    la boite, deplacait l'axe du titre d'exactement 1px. Une regle ecrite
    pour un sens de lecture n'en couvre qu'un. */
 .r.sub .k.tra[dir=rtl],.r.apar .k.tra[dir=rtl]{
  padding-left:26px;padding-right:26px;border-right:0}}

</style>

<script>
"use strict";
var LANGUES = {{LINGUIJSON}};

/* La hauteur de l'en-tete n'est pas une constante : deux lignes de
   titre sur telephone, une sur ordinateur. On la mesure au chargement
   et a chaque redimension, et on la depose dans --kapo ; les valeurs
   en dur du CSS ne servent que de secours avant que le script ait
   tourne. */
function kapo(){
  var h = document.querySelector("header").offsetHeight;
  document.documentElement.style.setProperty("--kapo", h + "px");
}
addEventListener("resize", kapo); kapo();

/* Le volet de la table des matieres, sur ecran etroit. */
var nav = document.getElementById("nav");
document.getElementById("tirL").onclick = function(){ nav.classList.toggle("mont"); };
nav.addEventListener("click", function(e){
  if (e.target.tagName === "A" && innerWidth <= 900) nav.classList.remove("mont");
});
/* UN TOUCHER AU DEHORS LE REFERME. Sur telephone le volet couvre la
   page ; il ne se fermait qu'en touchant de nouveau « Materio » ou en
   suivant un renvoi, et l'on restait pris devant la table. On ecoute
   donc le toucher plutot que le clic -- sur telephone il vient le
   premier, et le volet part sans attendre les 300ms du clic. Le bouton
   est exclu : il a deja sa bascule, et la fermer ici la rouvrirait
   aussitot. */
document.addEventListener("pointerdown", function(e){
  if (!nav.classList.contains("mont")) return;
  if (nav.contains(e.target) || e.target.closest("#tirL")) return;
  nav.classList.remove("mont");
});


/* --- LA RECHERCHE. Elle porte sur LES DEUX textes a la fois : un mot
   ido trouve le paragraphe, et sa traduction reste en face, meme si
   elle ne contient pas le mot. C'est le but des deux colonnes ; une
   recherche qui masquerait la case d'en face les separerait. --- */
var q = document.getElementById("q");

/* --- ET LE PLACEHOLDER SE RACCOURCIT SUR TELEPHONE. « Serchez en la du
   texti... » demande 154 px et le champ n'en avait que 43 : il sortait
   coupe a « Serchez en », ce qui se lit comme une panne et non comme une
   invite. Un texte tronque ne dit rien de plus qu'un texte court ; il
   dit seulement qu'on n'a pas regarde.

   LE NOM ACCESSIBLE, LUI, NE SE RACCOURCIT PAS. Le champ n'avait pour
   toute etiquette que son placeholder -- ce qui est deja une faiblesse,
   puisqu'un placeholder disparait des qu'on tape. Il porte maintenant un
   « aria-label » qui donne la phrase entiere a toute largeur : ce qui se
   raccourcit est ce qui se VOIT, jamais ce qui s'annonce.

   Le placeholder est un attribut : aucune feuille de style ne le change,
   et c'est la seule raison pour laquelle ceci est du script. Le reglage
   lui-meme est plus bas, dans serBarilo() : il depend de la largeur que
   le selecteur de langue laisse au champ, et le selecteur n'existe pas
   encore ici. --- */
var qLarga = q.getAttribute("placeholder");
var qKurta = "Serchez\u2026";
var qEtroita = window.matchMedia("(max-width:700px)");
var rangi = [].slice.call(document.querySelectorAll(".r"));
var origine = rangi.map(function(r){
  return [].map.call(r.querySelectorAll(".k"), function(k){ return k.innerHTML; });
});
function sansAccent(s){
  return s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
}
function surligner(el, brut, terme){
  if (!terme) { el.innerHTML = brut; return false; }
  /* On surligne dans le TEXTE, pas dans les balises : sans cela un
     terme qui tombe dans un attribut (href, title) casserait la page.
     On parcourt donc les noeuds de texte du fragment. */
  var d = document.createElement("div");
  d.innerHTML = brut;
  var trouve = false;
  var it = document.createTreeWalker(d, NodeFilter.SHOW_TEXT);
  var noeuds = [], n;
  while ((n = it.nextNode())) noeuds.push(n);
  noeuds.forEach(function(t){
    var s = t.nodeValue, plat = sansAccent(s), i = plat.indexOf(terme);
    if (i < 0) return;
    trouve = true;
    var frag = document.createDocumentFragment(), pos = 0;
    while (i >= 0){
      frag.appendChild(document.createTextNode(s.slice(pos, i)));
      var m = document.createElement("mark");
      m.textContent = s.slice(i, i + terme.length);
      frag.appendChild(m);
      pos = i + terme.length;
      i = plat.indexOf(terme, pos);
    }
    frag.appendChild(document.createTextNode(s.slice(pos)));
    t.parentNode.replaceChild(frag, t);
  });
  el.innerHTML = d.innerHTML;
  return trouve;
}
var minuteur = null;
q.addEventListener("input", function(){
  clearTimeout(minuteur);
  minuteur = setTimeout(chercher, 110);
});
/* Les ouvertures de tableau. La table des matieres les connait deja --
   ce sont ses entrees de premier rang -- et on s'en sert plutot que de
   les marquer une seconde fois dans la page. */
var ouvertures = {};
document.querySelectorAll("nav a.tt").forEach(function(a){
  ouvertures[a.dataset.ch] = 1;
});
var nulo = document.getElementById("nulo");
var gravuri = [].slice.call(document.querySelectorAll(".gravuro"));

function chercher(){
  var terme = sansAccent(q.value.trim());
  /* CE QUI NE REPOND PAS DISPARAIT, DE QUELQUE RANG QUE CE SOIT. La
     condition portait « && r.classList.contains("p") » : seuls les
     alineas etaient filtres, et les cent quarante-neuf titres du livre
     -- ouvertures de tableau et intertitres -- restaient a l'ecran quoi
     qu'on cherche. Deux alineas repondaient a « kranio », et l'on en
     voyait cent cinquante et un blocs ; une recherche sans reponse ne
     changeait rien du tout a la page, et l'on croyait le champ mort. Le
     rang d'un bloc ne dit pas s'il repond : seul son texte le dit. */
  var trouves = rangi.map(function(r, i){
    var trouve = false;
    [].slice.call(r.querySelectorAll(".k")).forEach(function(k, j){
      if (surligner(k, origine[i][j], terme)) trouve = true;
    });
    r.classList.toggle("for", !!terme && !trouve);
    r.classList.remove("tete");
    return trouve;
  });

  /* MAIS UN RESULTAT SANS SON TABLEAU NE SE SITUE PAS. On rend donc
     l'ouverture du tableau qui garde au moins une reponse : elle sert
     de titre courant a ses resultats. Une seule par tableau, et aucune
     pour les tableaux qui n'ont rien. */
  if (terme){
    var tete = null;
    rangi.forEach(function(r, i){
      // Si l'ouverture repond elle-meme, elle reste un resultat entier
      // et n'a pas a se replier sur son libelle.
      if (ouvertures[r.dataset.cle]) tete = trouves[i] ? null : r;
      else if (trouves[i] && tete){
        tete.classList.remove("for");
        tete.classList.add("tete");
        tete = null;
      }
    });
  }
  /* LES GRAVURES SE RETIRENT PENDANT LA RECHERCHE. Elles ne sont pas
     dans les rangs mais a cote d'eux, et le filtre les laissait donc en
     place : on cherchait un mot, les blocs disparaissaient, et les
     dix-neuf planches restaient a l'ecran, seules. Une planche fait
     douze cents points de large ; entre deux resultats elle les separe
     plus qu'elle ne les eclaire. La liste de resultats est une vue de
     TEXTE, et le tableau se regarde a sa place, dans la lecture. */
  gravuri.forEach(function(f){ f.classList.toggle("for", !!terme); });

  var rien = !trouves.some(function(v){ return v; });
  nulo.textContent = terme
    ? "Nula rezulto por « " + q.value.trim() + " »." : "";
  nulo.classList.toggle("mont", !!terme && rien);
  poserLangue(sel.value);
}

/* --- LE CHOIX DE LANGUE. Une colonne de droite a la fois ; les
   autres restent dans la page, cachees. Elles n'y sont pas pour rien :
   la recherche les traverse, et le passage d'une langue a l'autre est
   instantane.

   SAUF CELLES QU'ON N'A PAS ENCORE. Le francais est dans la page --
   c'est un fac-simile transcrit, il fait partie de l'objet. Les
   traductions, elles, sont marquees « differita » et vivent dans un
   fichier a part : la page ne porte que leurs cases vides, et l'on ne
   va chercher le texte qu'au moment ou le menu le demande. Une fois
   venu il ne repart plus, et la langue redevient une bascule sans
   requete.

   CE BLOC EST APRES LA RECHERCHE, ET IL LE FAUT : le texte qui arrive
   doit entrer dans « origine » -- la copie non surlignee dont la
   recherche repart -- puis relancer chercher(), sans quoi un mot deja
   tape ne serait pas surligne dans la langue qui vient d'arriver. --- */
var sel = document.getElementById("lg");
var venus = {};                      /* kodo -> promesse de chargement */

function verser(code, d){
  rangi.forEach(function(r, i){
    var cases = [].slice.call(r.querySelectorAll(".k"));
    cases.forEach(function(k, j){
      if (k.dataset.lg !== code) return;
      var t = d.k[r.dataset.cle];
      if (t == null) return;
      k.classList.remove("vaka", "dif");
      origine[i][j] = t;
      k.innerHTML = t;
    });
  });
  var tete = "noto-" + code + "-";
  document.querySelectorAll('.noto[data-lg="' + code + '"]').forEach(function(n){
    var t = d.noto[n.id.slice(tete.length)];
    if (t != null) n.innerHTML = t;
  });
  chercher();
}

function chargerLangue(code){
  if (venus[code]) return venus[code];
  var lg = LANGUES.filter(function(l){ return l.kodo === code; })[0];
  if (!lg || !lg.differita || !lg.adreso) return null;
  venus[code] = fetch(lg.adreso)
    .then(function(r){ return r.json(); })
    .then(function(d){ verser(code, d); })
    .catch(function(){ delete venus[code]; });
  return venus[code];
}

function poserLangue(code){
  chargerLangue(code);
  document.querySelectorAll(".k.tra").forEach(function(k){
    k.style.display = (k.dataset.lg === code) ? "" : "none";
  });
  try { localStorage.setItem("tabeli-lg", code); } catch(e){}
}
sel.onchange = function(){ poserLangue(sel.value); serBarilo(); };
var memo = null;
try { memo = localStorage.getItem("tabeli-lg"); } catch(e){}
if (memo && [].some.call(sel.options, function(o){ return o.value === memo; }))
  sel.value = memo;
poserLangue(sel.value);

/* --- LA BARRE SE PARTAGE PAR LA MESURE, ET DANS CET ORDRE : LE
   SELECTEUR PREND CE QU'IL MONTRE, LE CHAMP PREND LE RESTE, ET LE
   PLACEHOLDER PREND CE QUI TIENT.

   1. UN « select » SE DIMENSIONNE SUR SON OPTION LA PLUS LARGE, non sur
   celle qu'il affiche : « Español (América) » fait 121 px et fixait la
   largeur meme quand la case montrait « বাংলা », qui en fait 25. Sur un
   ecran de 360 px cela donnait 178 px au selecteur et 81 au champ --
   deux fois plus de place a ce qu'on touche une fois par visite qu'a ce
   dans quoi on tape. Et c'est cela, non la longueur du texte, qui
   empechait « Serchez... » de tenir : le placeholder n'etait pas trop
   long, le champ etait trop court.

   2. LE PLACEHOLDER SE MESURE AU LIEU DE SE DEVINER. On prend le plus
   long des textes qui TIENNENT -- la phrase entiere, sinon « Serchez... »,
   sinon rien. Rien n'est un choix et non un echec : la loupe dit deja ce
   qu'est le champ, et c'est le cas de la langue au plus long nom sur le
   plus petit ecran. Une regle mesuree vaut mieux qu'un seuil de plus :
   celui-ci se corrige tout seul le jour ou l'on changera la police, le
   texte, ou la liste des langues.

   3. AU LARGE, ON NE TOUCHE A RIEN. La place ne manque pas, et une
   largeur qui suivrait la langue ferait sauter la barre a chaque
   changement.

   La mesure se fait au canevas, dans la police CALCULEE des deux
   champs -- jamais dans une police supposee : elle a deja change une
   fois. --- */
var mezurilo = document.createElement("canvas").getContext("2d");
function policoDe(e){
  var st = getComputedStyle(e);
  return [st.fontStyle, st.fontWeight, st.fontSize, st.fontFamily].join(" ");
}
function serBarilo(){
  if (qEtroita.matches){
    var st = getComputedStyle(sel);
    mezurilo.font = policoDe(sel);
    var o = sel.options[sel.selectedIndex];
    sel.style.width = (Math.ceil(mezurilo.measureText(o ? o.textContent : "").width)
      + parseFloat(st.paddingLeft) + parseFloat(st.paddingRight) + 2) + "px";
  } else {
    sel.style.width = "";
  }
  var sq = getComputedStyle(q);
  mezurilo.font = policoDe(q);
  var loko = q.clientWidth - parseFloat(sq.paddingLeft) - parseFloat(sq.paddingRight);
  var texto = qEtroita.matches ? qKurta : qLarga;
  if (mezurilo.measureText(texto).width > loko) texto = qKurta;
  if (mezurilo.measureText(texto).width > loko) texto = "";
  q.setAttribute("placeholder", texto);
}
serBarilo();
if (qEtroita.addEventListener) qEtroita.addEventListener("change", serBarilo);
else qEtroita.addListener(serBarilo);
/* La largeur peut changer sans franchir le seuil -- un ecran pliant, une
   fenetre qu'on tire. On se raccroche donc aussi au redimensionnement,
   mais une fois par image : la mesure lit clientWidth, et la lire a
   chaque pixel ferait travailler la mise en page pour rien. */
var barilo0 = 0;
window.addEventListener("resize", function(){
  if (barilo0) return;
  barilo0 = requestAnimationFrame(function(){ barilo0 = 0; serBarilo(); });
});

/* --- LE TABLEAU EN PLEIN ECRAN. Au clic, la gravure s'ouvre sur toute
   la fenetre, sans quitter la page. Ce n'est pas la vue d'ensemble qu'on
   y montre mais l'IMAGE DE DETAIL : c'est celle qu'on veut regarder de
   pres, et c'est la meme ou se decouperont les gros plans -- une fois
   chargee, elle ne l'est plus jamais. --- */
var plena = document.getElementById("plena");
var plenaBildo = document.getElementById("plena-bildo");
var plenaVenis = null;

function ouvrirPlena(fig){
  var url = fig.dataset.detalo;
  if (plenaBildo.getAttribute("src") !== url){
    plenaBildo.width = fig.dataset.dl;
    plenaBildo.height = fig.dataset.dh;
    /* La vue d'ensemble s'affiche le temps que le detail arrive : on ne
       reste pas devant un rectangle vide. */
    plenaBildo.src = fig.querySelector("img").currentSrc
                  || fig.querySelector("img").src;
    var grand = new Image();
    grand.onload = function(){ plenaBildo.src = url; };
    grand.src = url;
  }
  plenaVenis = fig.querySelector("img");
  plena.classList.add("mont");
  document.body.style.overflow = "hidden";
  poserVue(1, 0, 0);
  document.getElementById("fermi").focus();
}
function fermarPlena(){
  plena.classList.remove("mont");
  document.body.style.overflow = "";
  if (plenaVenis) plenaVenis.focus({preventScroll:true});
}

/* --- LE TABLEAU S'AGRANDIT. Le plein ecran montre la planche entiere ;
   a cette taille une devanture fait deux centimetres et l'on n'y lit
   rien. On y ajoute donc le grossissement : molette, deux doigts,
   double-clic, ou les boutons du bas.

   L'ECHELLE 1 EST CELLE QUI TIENT DANS LA FENETRE, non celle de
   l'image : c'est ce que l'oeil appelle « le tableau entier », et le
   chiffre affiche compte a partir de la. Au-dela de six fois, on
   verrait la trame du fac-simile et plus la gravure ; en deca de un,
   la planche flotterait dans du noir. On borne donc.

   ON DEPLACE EN GARDANT LE POINT SOUS LE DOIGT. Zoomer autour du
   centre de la fenetre parait juste tant qu'on regarde le centre ; des
   qu'on vise un coin, l'objet vise s'enfuit. Le point d'ancrage est
   donc celui qu'on montre — la souris, ou le milieu des deux doigts. --- */
var vuo = {k:1, x:0, y:0};
var VUO_MAX = 6;

function poserVue(k, x, y){
  vuo.k = Math.min(VUO_MAX, Math.max(1, k));
  /* LA MARGE DE DEPLACEMENT, c'est ce qui depasse de la fenetre une fois
     l'image agrandie. A l'echelle 1 elle est nulle des deux cotes :
     l'image tient tout entiere, et rien ne peut la faire glisser. */
  var b = plena.getBoundingClientRect();
  var mx = Math.max(0, (plenaBildo.offsetWidth * vuo.k - b.width) / 2);
  var my = Math.max(0, (plenaBildo.offsetHeight * vuo.k - b.height) / 2);
  vuo.x = Math.min(mx, Math.max(-mx, x));
  vuo.y = Math.min(my, Math.max(-my, y));
  plenaBildo.style.transform = "translate(" + vuo.x + "px," + vuo.y + "px) scale("
                             + vuo.k + ")";
  plena.classList.toggle("prox", vuo.k > 1.001);
  var g = document.getElementById("plena-grado");
  if (g) g.textContent = (Math.round(vuo.k * 10) / 10) + "\u00d7";
}

/* Le grossissement autour d'un point de la fenetre : ce point ne bouge
   pas, tout le reste s'ecarte de lui. */
function grossir(nk, px, py){
  var b = plena.getBoundingClientRect();
  var cx = px - b.left - b.width / 2, cy = py - b.top - b.height / 2;
  nk = Math.min(VUO_MAX, Math.max(1, nk));
  var f = nk / vuo.k;
  poserVue(nk, cx - (cx - vuo.x) * f, cy - (cy - vuo.y) * f);
}

plena.addEventListener("wheel", function(e){
  if (!plena.classList.contains("mont")) return;
  e.preventDefault();
  /* Le pave tactile d'un portable envoie un pincement comme une molette
     tenue avec Ctrl : les deux se traitent pareil, au pas pres. */
  var pas = e.ctrlKey ? 0.012 : 0.0022;
  grossir(vuo.k * Math.exp(-e.deltaY * pas), e.clientX, e.clientY);
}, {passive:false});

plena.addEventListener("dblclick", function(e){
  if (e.target.closest(".lupili") || e.target.closest(".fermi")) return;
  grossir(vuo.k > 1.001 ? 1 : 3, e.clientX, e.clientY);
});

document.querySelectorAll(".plena .lupili button").forEach(function(t){
  t.addEventListener("click", function(e){
    e.stopPropagation();
    var b = plena.getBoundingClientRect();
    var mx = b.left + b.width / 2, my = b.top + b.height / 2;
    if (t.dataset.lupilo === "+") grossir(vuo.k * 1.5, mx, my);
    else if (t.dataset.lupilo === "-") grossir(vuo.k / 1.5, mx, my);
    else poserVue(1, 0, 0);
  });
});

/* LE GLISSEMENT, a la souris comme au doigt. « pointerdown » couvre les
   trois — souris, doigt, stylet — et deux doigts a la fois donnent le
   pincement : on suit alors leur ECART, qui donne l'echelle, et leur
   MILIEU, qui donne le point fixe. */
var doigts = new Map(), depart = null, bougea = false;

plena.addEventListener("dragstart", function(e){ e.preventDefault(); });
plena.addEventListener("pointerdown", function(e){
  if (e.target.closest(".lupili") || e.target.closest(".fermi")) return;
  doigts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  bougea = false;
  if (doigts.size === 1){
    depart = {x:e.clientX, y:e.clientY, vx:vuo.x, vy:vuo.y};
    plena.classList.add("tiras");
    plena.setPointerCapture(e.pointerId);
  } else if (doigts.size === 2){
    var d = [...doigts.values()];
    depart = {ecart:Math.hypot(d[0].x-d[1].x, d[0].y-d[1].y), k:vuo.k,
              mx:(d[0].x+d[1].x)/2, my:(d[0].y+d[1].y)/2,
              vx:vuo.x, vy:vuo.y};
  }
});
plena.addEventListener("pointermove", function(e){
  if (!doigts.has(e.pointerId) || !depart) return;
  doigts.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (doigts.size >= 2 && depart.ecart){
    var d = [...doigts.values()];
    var ec = Math.hypot(d[0].x-d[1].x, d[0].y-d[1].y);
    if (ec > 4){
      vuo.x = depart.vx; vuo.y = depart.vy; vuo.k = depart.k;
      grossir(depart.k * ec / depart.ecart, depart.mx, depart.my);
      bougea = true;
    }
    return;
  }
  var dx = e.clientX - depart.x, dy = e.clientY - depart.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) bougea = true;
  if (vuo.k > 1.001) poserVue(vuo.k, depart.vx + dx, depart.vy + dy);
});
function lacher(e){
  doigts.delete(e.pointerId);
  if (doigts.size === 0){ depart = null; plena.classList.remove("tiras"); }
  else if (doigts.size === 1){
    var d = [...doigts.entries()][0];
    depart = {x:d[1].x, y:d[1].y, vx:vuo.x, vy:vuo.y};
  }
}
plena.addEventListener("pointerup", lacher);
plena.addEventListener("pointercancel", lacher);

document.addEventListener("click", function(e){
  var fig = e.target.closest ? e.target.closest(".gravuro") : null;
  if (fig){ ouvrirPlena(fig); return; }
  if (!plena.classList.contains("mont")) return;
  /* ON NE FERME PAS EN TIRANT. Un glissement finit par un « click » que
     le navigateur envoie quand meme ; sans cette garde, deplacer la vue
     la refermait. */
  if (bougea){ bougea = false; return; }
  if (e.target.closest(".fermi")){ fermarPlena(); return; }
  if (e.target.closest(".lupili")) return;
  /* SUR L'IMAGE AGRANDIE, LE CLIC NE FERME PLUS : il sert a la
     deplacer, et se refermer au moindre arret de la main serait
     insupportable. On ferme alors par le fond, par la croix, ou par
     Echap.
     C'est la PLACE du clic qui decide, non sa cible : une image en
     « object-fit » agrandie par une transformation ne se designe pas
     de facon sure — le navigateur rend tantot l'image, tantot le fond
     qui la porte, pour un clic tombe au meme endroit. Le rectangle,
     lui, ne ment pas. */
  if (vuo.k > 1.001){
    var r = plenaBildo.getBoundingClientRect();
    if (e.clientX >= r.left && e.clientX <= r.right &&
        e.clientY >= r.top && e.clientY <= r.bottom) return;
  }
  fermarPlena();
});
addEventListener("keydown", function(e){
  if (!plena.classList.contains("mont")) return;
  if (e.key === "Escape"){ fermarPlena(); return; }
  var b = plena.getBoundingClientRect();
  var mx = b.left + b.width / 2, my = b.top + b.height / 2;
  if (e.key === "+" || e.key === "=") grossir(vuo.k * 1.5, mx, my);
  else if (e.key === "-") grossir(vuo.k / 1.5, mx, my);
  else if (e.key === "0") poserVue(1, 0, 0);
  else if (vuo.k > 1.001 && e.key.indexOf("Arrow") === 0){
    var p = 80;
    poserVue(vuo.k, vuo.x + (e.key === "ArrowLeft" ? p : e.key === "ArrowRight" ? -p : 0),
                    vuo.y + (e.key === "ArrowUp" ? p : e.key === "ArrowDown" ? -p : 0));
    e.preventDefault();
  }
});
addEventListener("resize", function(){
  if (plena.classList.contains("mont")) poserVue(vuo.k, vuo.x, vuo.y);
});

/* --- LE DEPLI DES NOTES. La note vit a la fin du document, cachee ;
   au clic, on la deplace sous l'alinea qui l'appelle, et un second
   clic la remet. On la DEPLACE au lieu de la copier : ainsi elle
   n'existe qu'une fois dans la page, et la recherche ne la trouve pas
   deux fois. --- */
document.addEventListener("click", function(e){
  var b = e.target.closest ? e.target.closest(".apel") : null;
  if (!b) return;
  var n = document.getElementById("noto-" + b.dataset.noto);
  if (!n) return;
  var ouvert = b.getAttribute("aria-expanded") === "true";
  if (ouvert){
    n.hidden = true;
    b.setAttribute("aria-expanded", "false");
  } else {
    var rang = b.closest(".r");
    if (rang && n.previousElementSibling !== rang)
      rang.parentNode.insertBefore(n, rang.nextSibling);
    n.hidden = false;
    b.setAttribute("aria-expanded", "true");
  }
});

/* --- LE GROS PLAN SUR UN NUMERO. Au clic sur « (12) », l'objet 12 de
   la planche parait sous l'alinea, agrandi.

   C'EST UN RECADRAGE, JAMAIS UN CHARGEMENT. On ne va pas chercher une
   image par numero : on prend celle de DETAIL de la planche — la meme
   qui sert au plein ecran — et l'on n'en montre qu'un morceau, en
   jouant sur « background-size » et « background-position ». Le
   premier gros plan d'un tableau la fait venir s'il ne l'est pas
   encore ; tous les suivants ne coutent rien du tout, et le plein
   ecran s'en sert aussi.

   LE CADRE SE CALCULE A L'OUVERTURE, non a la fabrication de la page :
   il depend de la largeur de la colonne, qui depend de la fenetre. On
   prend un carre de neuf hauteurs de chiffre autour du numero — assez
   pour que l'objet designe tienne dedans avec son entourage — puis on
   l'etire a la forme du cadre, sans jamais deformer l'image. --- */
document.addEventListener("click", function(e){
  var b = e.target.closest ? e.target.closest(".lupo") : null;
  if (b) { ouvrirLupo(b); return; }
  var k = e.target.closest ? e.target.closest(".lupo-vido") : null;
  if (k && k.dataset.par){
    var src = document.querySelector('[data-lupo="' + k.dataset.par + '"]');
    if (src) ouvrirLupo(src);
  }
});

var lupoN = 0;

function ouvrirLupo(b){
  var vide = b.nextElementSibling;
  if (b.getAttribute("aria-expanded") === "true"){
    var v = document.querySelector('.lupo-vido[data-par="' + b.dataset.lupo + '"]');
    if (v) v.remove();
    b.setAttribute("aria-expanded", "false");
    return;
  }
  var fig = document.querySelector('.gravuro[data-cle="' + b.dataset.g + '"]');
  if (!fig) return;
  var c = b.dataset.c.split(",").map(Number);   /* x, y, largeur, hauteur */
  var W = +fig.dataset.dl, H = +fig.dataset.dh;
  if (!W || !H) return;

  var rang = b.closest(".r");
  if (!rang) return;
  if (!b.dataset.lupo) b.dataset.lupo = "l" + (++lupoN);
  /* Un seul gros plan ouvert a la fois : deux vues de la meme planche
     l'une sous l'autre ne s'expliquent pas mieux que la premiere. */
  document.querySelectorAll(".lupo-vido").forEach(function(v){
    var s = document.querySelector('[data-lupo="' + v.dataset.par + '"]');
    if (s) s.setAttribute("aria-expanded", "false");
    v.remove();
  });

  var vue = document.createElement("div");
  vue.className = "lupo-vido";
  vue.dataset.par = b.dataset.lupo;
  var kadro = document.createElement("div");
  kadro.className = "kadro";
  var dir = document.createElement("div");
  dir.className = "dir";
  dir.innerHTML = '<span><b>(' + b.dataset.n + ')</b> ' +
    (b.getAttribute("title") || "") + '</span>' +
    '<span>' + b.dataset.g.slice(0, 3).toUpperCase().replace("T", "tabelo ")
      .replace(/^tabelo 0/, "tabelo ") + '</span>';
  vue.appendChild(kadro);
  vue.appendChild(dir);
  rang.parentNode.insertBefore(vue, rang.nextSibling);

  /* Le carre de source, en fractions de la planche. */
  var demi = 4.5 * c[3];                        /* 9 hauteurs de chiffre */
  var cx = c[0] + c[2] / 2, cy = c[1] + c[3] / 2;
  var lg = kadro.clientWidth, ht = kadro.clientHeight;
  var sh = Math.min(1, demi * 2);
  var sw = Math.min(1, (sh * H * lg) / (ht * W));  /* meme forme que le cadre */
  var sx = Math.min(1 - sw, Math.max(0, cx - sw / 2));
  var sy = Math.min(1 - sh, Math.max(0, cy - sh / 2));
  kadro.style.backgroundImage = 'url("' + fig.dataset.detalo + '")';
  /* LA PLACE SE COMPTE EN POINTS D'ECRAN, non en pour-cent. Les deux
     disent la meme chose tant que la vue ne bouge pas ; des qu'on la
     tire, le pour-cent oblige a repasser par la fraction de planche a
     chaque mouvement du doigt — et il se divise par une marge qui vaut
     zero quand l'image tient juste. En points, glisser c'est ajouter. */
  kadro._vido = {bw: lg / sw, bh: ht / sh, px: -(sx / sw) * lg,
                 py: -(sy / sh) * ht};
  poserKadro(kadro);
  b.setAttribute("aria-expanded", "true");
}

/* --- LA VUE SE DEPLACE. Le gros plan tombe sur l'objet nomme ; l'oeil
   veut ensuite voir a cote — l'etalage au bout du comptoir, la maison
   d'a cote. On tire donc la vue, a la souris comme au doigt.
   Le grossissement, lui, ne change pas : il est ce qu'il est pour que
   l'objet tienne dans le cadre avec ce qui l'entoure, et le lecteur qui
   veut plus grand a le plein ecran, qui grossit. --- */
function poserKadro(kadro){
  var d = kadro._vido;
  if (!d) return;
  var lg = kadro.clientWidth, ht = kadro.clientHeight;
  d.px = Math.min(0, Math.max(lg - d.bw, d.px));
  d.py = Math.min(0, Math.max(ht - d.bh, d.py));
  kadro.style.backgroundSize = d.bw + "px " + d.bh + "px";
  kadro.style.backgroundPosition = d.px + "px " + d.py + "px";
}

var tirage = null, tiraBougea = false;
document.addEventListener("pointerdown", function(e){
  var k = e.target.closest ? e.target.closest(".lupo-vido .kadro") : null;
  if (!k || !k._vido) return;
  tirage = {k:k, x:e.clientX, y:e.clientY, px:k._vido.px, py:k._vido.py};
  tiraBougea = false;
  k.classList.add("tiras");
  k.setPointerCapture(e.pointerId);
});
document.addEventListener("pointermove", function(e){
  if (!tirage) return;
  var dx = e.clientX - tirage.x, dy = e.clientY - tirage.y;
  if (Math.abs(dx) + Math.abs(dy) > 4) tiraBougea = true;
  tirage.k._vido.px = tirage.px + dx;
  tirage.k._vido.py = tirage.py + dy;
  poserKadro(tirage.k);
});
function lacherKadro(){
  if (!tirage) return;
  tirage.k.classList.remove("tiras");
  tirage = null;
}
document.addEventListener("pointerup", lacherKadro);
document.addEventListener("pointercancel", lacherKadro);
/* Le glissement finit par un « click » que le navigateur envoie quand
   meme ; sans cette garde, deplacer la vue la refermait. */
document.addEventListener("click", function(e){
  if (!tiraBougea) return;
  if (e.target.closest && e.target.closest(".lupo-vido")){
    e.stopPropagation();
    tiraBougea = false;
  }
}, true);
addEventListener("resize", function(){
  document.querySelectorAll(".lupo-vido .kadro").forEach(poserKadro);
});

/* --- L'INTITULE COURANT dans la table des matieres. On ne suit pas le
   defilement pixel par pixel : on observe les blocs de titre, et le
   dernier qui a passe le haut de la fenetre est celui qu'on lit. --- */
var titres = [].slice.call(document.querySelectorAll(".r.sub, .r.apar"));
var liens = {};
document.querySelectorAll("nav a").forEach(function(a){ liens[a.dataset.ch] = a; });
function courant(){
  var h = parseInt(getComputedStyle(document.documentElement)
            .getPropertyValue("--kapo")) || 104;
  var vu = null;
  titres.forEach(function(t){
    if (t.getBoundingClientRect().top - h - 14 <= 1) vu = t;
  });
  for (var c in liens) liens[c].classList.remove("nun");
  if (vu && liens[vu.dataset.cle]){
    liens[vu.dataset.cle].classList.add("nun");
    var a = liens[vu.dataset.cle], p = a.parentNode;
    if (a.offsetTop < p.scrollTop || a.offsetTop > p.scrollTop + p.clientHeight - 30)
      p.scrollTop = a.offsetTop - p.clientHeight / 2;
  }
}
addEventListener("scroll", function(){
  requestAnimationFrame(courant);
}, {passive:true});
courant();
</script>
